<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Botonera</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Botonera">
<meta name="theme-color" content="#1F2D3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif:wght@400;600&display=swap">
<style>
  :root{
    --bg:#f6f3ee; --surface:#ffffff; --surface-2:#faf8f4;
    --ink:#1f2328; --muted:#5f6670; --faint:#9aa0a8;
    --line:#e4dfd6; --line-strong:#cfc8bb;
    --brand:#2f5d8a; --brand-bg:#eaf0f6; --on-brand:#ffffff;
    --go:#1f8a56; --go-bg:#e3f3e9;
    --warn:#b5761a; --warn-bg:#f8eede;
    --no:#c0435a; --no-bg:#fae6ea;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --r-s:8px; --r-m:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121417; --surface:#1b1e23; --surface-2:#20242a;
      --ink:#e8eaed; --muted:#a2a9b2; --faint:#6f7781;
      --line:#2c3138; --line-strong:#3a4049;
      --brand:#7fb0e0; --brand-bg:#1e2a37; --on-brand:#101418;
      --go:#4cc588; --go-bg:#14301f;
      --warn:#d9a24a; --warn-bg:#322612;
      --no:#e8788c; --no-bg:#331920;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }
  button,input{font:inherit;color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px 16px}
  .top{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
  .top h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .top .btn{margin-left:auto}
  .btn{
    border:.5px solid var(--line-strong);background:var(--surface);color:var(--ink);
    border-radius:var(--r-s);padding:6px 12px;cursor:pointer;font-size:13px;
  }
  .btn:hover{background:var(--surface-2)}
  .btn.primario{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-size:15px;padding:10px 16px}
  .btn.primario:hover{opacity:.92}
  .btn[disabled]{opacity:.55;cursor:default}

  /* pantalla de entrada */
  .entrada{max-width:380px;margin:12vh auto 0;text-align:center}
  .entrada h1{font-size:20px;margin:0 0 6px;font-weight:600}
  .entrada p{color:var(--muted);margin:0 0 20px}
  .entrada .btn.primario{width:100%}
  .pin{
    display:block;width:100%;margin:0 0 12px;padding:12px 8px 12px calc(8px + .5em);
    border:.5px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);
    text-align:center;font-size:32px;line-height:1.2;letter-spacing:.5em;
    font-variant-numeric:tabular-nums;-webkit-text-security:disc;
  }
  .pin:focus{outline:2px solid var(--brand);outline-offset:1px}
  .pin[disabled]{opacity:.6}
  .aviso{margin-top:12px;font-size:13px;color:var(--muted);min-height:1.4em}
  .aviso.err{color:var(--no)}
  .aviso.ok{color:var(--go)}

  /* app */
  .app{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
  /* el home es solo el swipe: sin la lista de botoneras ni el panel vacio; el panel aparece solo con ?c=<clave> */
  .app:not(.detalle){grid-template-columns:minmax(0,440px);justify-content:center}
  .app:not(.detalle) .panel{display:none}
  @media (min-width:860px){
    .app{grid-template-columns:340px minmax(0,1fr)}
    .lista{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  }
  .lista{min-width:0}
  .grupo{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m);margin-bottom:10px;overflow:hidden}
  .grupo-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:.5px solid var(--line)}
  .grupo-h .t{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 7px;
    border-radius:10px;font-size:12px;font-weight:600;background:var(--brand-bg);color:var(--brand);flex:none;
  }
  .pill.mudo{background:var(--surface-2);color:var(--muted);border:.5px solid var(--line)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.go{background:var(--go-bg);color:var(--go)}
  .pill.no{background:var(--no-bg);color:var(--no)}
  .grupo-h .pill{margin-left:auto}
  .item{
    display:block;width:100%;text-align:left;background:none;border:0;border-top:.5px solid var(--line);
    padding:10px 12px;cursor:pointer;
  }
  .grupo-h + .item{border-top:0}
  .item:hover{background:var(--surface-2)}
  .item.sel{background:var(--brand-bg)}
  .item .t{font-size:14px;overflow-wrap:anywhere}
  .item .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
  .plegable{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m);margin-bottom:10px;overflow:hidden}
  .plegable summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .plegable summary::-webkit-details-marker{display:none}
  .plegable summary::before{content:"+";display:inline-block;width:12px;color:var(--faint)}
  .plegable[open] summary::before{content:"\2212"}
  .plegable summary .pill{margin-left:auto}
  .vacio{padding:24px 12px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m)}

  .panel{min-width:0}
  .panel-vacio{padding:48px 16px;text-align:center;color:var(--muted);background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m)}
  .cab{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m);padding:14px;margin-bottom:12px}
  .cab h2{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
  .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
  .meta b{font-weight:500;color:var(--ink)}
  .pasos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .paso{
    flex:1 1 150px;min-width:0;border:.5px solid var(--line);border-radius:var(--r-s);padding:8px 10px;
    background:var(--surface-2);color:var(--muted);
  }
  .paso .n{font-size:13px;font-weight:600}
  .paso .h{font-size:12px;margin-top:2px;min-height:1.3em}
  .paso.hecho{background:var(--go-bg);border-color:transparent;color:var(--go)}
  .paso.hecho .h{color:var(--ink)}
  .nota-estado{margin-top:10px;font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:var(--r-s);padding:8px 10px}
  /* Agente trabajando: puntito que late (CSS puro). Sin animacion si la persona pidio menos movimiento */
  .trab{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:500}
  .trab.largo{color:var(--warn)}
  .pulso{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;animation:latido 1.4s ease-in-out infinite}
  @keyframes latido{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}
  @media (prefers-reduced-motion: reduce){ .pulso{animation:none} }
  .paso.trab-p{background:var(--brand-bg);border-color:transparent}
  .paso.trab-p .n{color:var(--brand)}
  .paso.trab-p .h{color:var(--brand)}
  .paso.trab-p.largo .n,.paso.trab-p.largo .h{color:var(--warn)}
  .paso.trab-p.largo{background:var(--warn-bg)}
  .paso.espera-p{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
  .paso.espera-p .h{color:var(--ink)}
  /* te espera: la pelota la tiene el usuario en la conversacion */
  .espw{border-top:.5px solid var(--line)}
  .grupo-h + .espw{border-top:0}
  .espw .item{border-top:0;background:none;padding-bottom:4px}
  .espw:hover{background:var(--surface-2)}
  .espw.sel,.espw.sel:hover{background:var(--brand-bg)}
  .espw .espera-m{font-size:13px;margin-top:4px;overflow-wrap:anywhere}
  .espw .lnk-ses{display:inline-block;margin:0 12px 10px}
  .espera-blq{background:var(--warn-bg);border-radius:var(--r-m);padding:12px 14px;margin-bottom:12px}
  .espera-blq .et{font-size:13px;font-weight:600;color:var(--warn)}
  .espera-blq .em{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
  .espera-blq .ef{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
  .lnk-ses{color:var(--brand);text-decoration:none;font-size:13px;white-space:nowrap}
  .lnk-ses:hover{text-decoration:underline}
  .lnk-ses.chico{flex:none;font-size:15px;line-height:1;padding:2px 4px;border-radius:var(--r-s)}
  .lnk-ses.chico:hover{background:var(--brand-bg);text-decoration:none}
  /* lo decidido: lectura, no botonera */
  .dec{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-m);padding:14px;margin-bottom:12px}
  .dec-t{font-size:13px;font-weight:600;margin-bottom:2px}
  .dec-sub{font-size:12px;color:var(--muted);margin-bottom:6px}
  .dec-vacio{font-size:14px;color:var(--muted);padding:4px 0}
  .dec-fila{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:.5px solid var(--line)}
  .dec-n{flex:none;width:22px;text-align:right;font-size:12px;color:var(--faint);padding-top:2px}
  .dec-fila .pill{min-width:78px;margin-top:0}
  .dec-x{min-width:0;flex:1;overflow-wrap:anywhere;font-size:14px}
  .dec-x .a{font-size:12.5px;color:var(--muted);margin-top:1px}
  .dec-x .c{font-size:13px;margin-top:4px;padding:5px 8px;border-radius:var(--r-s);background:var(--warn-bg);color:var(--ink)}
  .dec-x .c b{font-weight:600;color:var(--warn)}
  /* lo pendiente: filas activas del MISMO bloque que lo decidido (fondo crema = lo que falta) */
  .dec-fila.pend{background:var(--warn-bg);border-top:0;border-radius:var(--r-s);padding:10px 8px;margin-top:6px}
  .p-ctx{font-size:12.5px;color:var(--muted);margin-top:3px}
  .p-img{margin-top:8px}
  .p-img img{display:block;width:100%;height:auto;max-height:180px;object-fit:cover;object-position:top;border-radius:var(--r-s);border:1px solid var(--line)}
  .p-det{margin-top:6px;font-size:12.5px;color:var(--muted)}
  .p-det summary{cursor:pointer;color:var(--ink);font-weight:500}
  .p-det .p-imp{margin-top:6px}
  .p-img .afuera,.sw-img .afuera{display:inline-block;margin-top:4px;font-size:12.5px}
  .p-imp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;font-size:12.5px;color:var(--muted)}
  .p-imp div{padding:6px 8px;border-radius:var(--r-s);border-left:3px solid}
  .p-imp b{display:block;font-weight:600;color:var(--ink)}
  .p-imp .pos{border-color:var(--go)}
  .p-imp .neg{border-color:var(--no)}
  @media (max-width:520px){ .p-imp{grid-template-columns:1fr} }
  .p-fte{font-size:12.5px;color:var(--muted);margin-top:6px}
  .p-fte span{font-weight:600;color:var(--ink)}
  .p-intro{font-size:12.5px;color:var(--muted);margin-top:6px;padding:8px 10px;border-radius:var(--r-s);border:1px dashed var(--line)}
  .p-intro b{font-weight:600;color:var(--ink)}
  .p-intro ul{margin:2px 0 0 16px;padding:0}
  .dec a.lnk,.p-img a,.sw-dcard a,.sw-ct a{color:inherit;text-decoration:underline;overflow-wrap:anywhere}
  .p-antec{font-size:12.5px;color:var(--muted);margin-top:6px}
  .p-antec b{font-weight:600;color:var(--ink)}
  .p-antec ul{margin:2px 0 0 16px;padding:0}
  .p-antec .snd{margin-top:4px}
  .p-reco{font-size:12.5px;margin-top:6px;color:var(--muted)}
  .p-reco b{font-weight:600}
  .p-reco .r-go{color:var(--go)}
  .p-reco .r-no{color:var(--no)}
  .p-acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .pb{
    flex:1 1 96px;min-width:0;font-size:14px;font-weight:600;padding:9px 10px;border-radius:var(--r-s);cursor:pointer;
    border:1.5px solid var(--line-strong);background:var(--surface);color:var(--muted);overflow-wrap:anywhere;
  }
  .pb.go.rec{border-color:var(--go);color:var(--go)}
  .pb.no.rec{border-color:var(--no);color:var(--no)}
  .pb.go:hover:not([disabled]){border-color:var(--go);color:var(--go)}
  .pb.no:hover:not([disabled]){border-color:var(--no);color:var(--no)}
  .pb.go.on{background:var(--go);border-color:var(--go);color:#fff}
  .pb.no.on{background:var(--no);border-color:var(--no);color:#fff}
  .pb[disabled]{cursor:default;opacity:.7}
  .pcom{
    display:block;width:100%;margin-top:8px;padding:8px 10px;font-size:14px;
    border:.5px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface);color:var(--ink);
  }
  .pcom:focus{outline:2px solid var(--brand);outline-offset:1px}
  .pcom[disabled]{opacity:.7}
  .p-bar{
    position:sticky;bottom:0;z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--surface);border-top:.5px solid var(--line);padding:10px 0;margin-top:6px;
  }
  .p-bar .cnt{font-size:13px;color:var(--muted)}
  .p-bar .btn.primario{margin-left:auto}
  .p-msg{flex:1 0 100%;font-size:12.5px;color:var(--no)}
  .p-sub{font-size:12.5px;color:var(--muted);margin-top:8px}
  .p-sub .lnk-ses{margin-left:6px}
  @media (max-width:859px){ .pcom{font-size:16px} }
  .dec-txt{font-size:13.5px;overflow-wrap:anywhere}
  .dec-txt div.l{padding:2px 0}
  .dec-sec{margin-top:12px;padding-top:10px;border-top:.5px solid var(--line)}
  .marco{border:.5px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
  /* alto fijo de viewport: --ocupado lo mide medirMarco() (lo que hay arriba del iframe). El scroll va adentro. */
  .marco iframe{
    display:block;width:100%;border:0;background:transparent;
    height:calc(100vh - var(--ocupado,260px));
    height:calc(100dvh - var(--ocupado,260px));
    min-height:420px;
  }
  .marco.orig iframe{height:75vh;height:75dvh;min-height:420px}
  .volver{display:none;margin-bottom:10px}
  /* el link claude:// abre la app de Claude Code de la compu. En un dispositivo táctil se saca, salvo que esa app lo acepte (LINK_CELU, o ?linkcelu=1 para probarlo). Se decide por dispositivo táctil, no por ancho: en la compu, con una ventana angosta, se conserva */
  @media (hover:none) and (pointer:coarse){
    html:not(.link-celu) .lnk-ses,html:not(.link-celu) .espw .lnk-ses{display:none}
  }
  @media (max-width:859px){
    .volver{display:inline-block}
    .espw .item{padding-bottom:10px}
    /* en el celu se ve la lista o la botonera, nunca las dos apiladas */
    .app.detalle .lista{display:none}
    .app:not(.detalle) .panel{display:none}
  }

  /* ---------- modo swipe: paleta propia, no sigue el tema claro/oscuro de la pagina ---------- */
  .cab-acc{margin-top:12px;display:flex}
  .cab-acc .btn{padding:9px 16px;font-size:14px;font-weight:600}
  html.sw-lock,html.sw-lock body{overflow:hidden}
  .sw{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#F5F0E8;color:#1C1B1B;
    font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.45;
    overflow:hidden;overscroll-behavior:contain;-webkit-tap-highlight-color:transparent;
  }
  .sw *{box-sizing:border-box}
  .sw button{font-family:inherit;color:#1C1B1B;cursor:pointer}
  .sw-main{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:460px;margin:0 auto}
  .sw-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 4px;flex:none}
  .sw-st{font-size:14px;font-weight:700}
  .sw-b{border:2px solid #1C1B1B;background:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;min-height:36px}
  .sw-b[disabled]{opacity:.4;cursor:default}
  .sw .sw-tr{display:flex;gap:6px}
  .sw .sw-env{background:#8ECAC8}
  .sw-prog{flex:none;padding:2px 16px 8px;text-align:center;font-size:13px;font-weight:600;color:#3a3837}
  .sw-prog b{font-weight:700;color:#1C1B1B}
  .sw-aviso{flex:none;margin:0 14px 8px;padding:8px 10px;border:2px solid #1C1B1B;border-radius:10px;background:#FFF1C7;font-size:13px;font-weight:600}
  .sw-stage{flex:1 1 auto;min-height:0;position:relative;display:flex;padding:6px 22px 22px 14px}
  .sw-stack{position:relative;flex:1;min-width:0;min-height:220px}
  .sw-peek{position:absolute;inset:0;z-index:0;transform:translate(8px,8px);background:#fff;border:2px solid #1C1B1B;border-radius:12px}
  .sw-hints{position:absolute;inset:0;z-index:1;border-radius:12px;overflow:hidden;pointer-events:none}
  .sw-h{position:absolute;inset:8px;border-radius:12px;opacity:0;display:flex;padding:12px;box-shadow:0 0 0 1px rgba(28,27,27,.15)}
  .sw-h i{display:flex;flex-direction:column;align-items:center;gap:6px;font-style:normal;font-size:13px;font-weight:700;line-height:1.2;text-align:center;max-width:96px;overflow-wrap:anywhere}
  .sw-h svg{width:28px;height:28px;flex:none}
  .sw-h.go{background:#8ECAC8;color:#1C1B1B;align-items:center;justify-content:flex-start}
  .sw-h.no{background:#262626;color:#fff;align-items:center;justify-content:flex-end}
  .sw-h.no svg{stroke:#E5E5E5}
  .sw-h.up{background:#E5E5E5;color:#1C1B1B;align-items:flex-end;justify-content:center}
  .sw-card{
    position:absolute;inset:0;z-index:2;background:#fff;border:2px solid #1C1B1B;border-radius:12px;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;will-change:transform;
  }
  .sw-card.arr{cursor:grabbing}
  .sw-card:focus-visible{outline:3px solid #8ECAC8;outline-offset:3px}
  .sw-card img{-webkit-user-drag:none;pointer-events:none}
  .sw-ct{padding:18px 18px 0;display:flex;flex-direction:column;gap:12px;height:100%}
  .sw-card h2,.sw-dcard h2,.sw-msg h2{font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-weight:600;margin:0;color:#1C1B1B}
  .sw-card h2{font-size:21px;line-height:1.28;overflow-wrap:anywhere}
  .sw-ctx{margin:0;font-size:15px;color:#3a3837;overflow-wrap:anywhere}
  .sw-dib{display:block;width:100%;max-height:150px;object-fit:contain;background:#FAF7F0;border-radius:8px;padding:8px;flex:none}
  .sw-img{flex:none}
  .sw-img img{display:block;width:100%;max-height:220px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid #E6E1D8}
  .sw-img.grande img{max-height:none}
  .sw-img,.p-img{position:relative}
  /* la pieza a pantalla completa: el ícono de agrandar en la esquina; en la card es solo una pista (el toque lo toma el mazo) */
  .amp{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:8px;border:1.5px solid #1C1B1B;background:#fff;color:#1C1B1B;
    font:700 16px/1 system-ui,sans-serif;display:grid;place-items:center;padding:0;cursor:pointer}
  span.amp{pointer-events:none}

  /* card de contexto: una carpeta tintada con el color de la categoria, con la pila de cartas asomando por arriba.
     --k cartas (1-4), --Y alto libre arriba de la carpeta, --tinte el frente, --cat la pestaña. No es una decision: sin recomendacion ni Va / No va */
  .sw-card.ctx,.sw-dcard.ctx{background:var(--tinte,#F5F0E8);color:#1C1B1B;border-color:#1C1B1B;overflow:visible}
  .sw-card.ctx{top:var(--Y,42px)}

  /* la pila: cada carta asoma 7px mas arriba y 7px mas angosta que la de abajo; blancas y tintadas alternadas */
  .sw-hoja{
    position:absolute;z-index:calc(5 - var(--i));bottom:calc(100% + 2px);height:calc(3px + var(--i)*7px);
    left:calc(3px + var(--i)*7px);right:calc(3px + var(--i)*7px);
    border:2px solid #1C1B1B;border-bottom:0;border-radius:10px 10px 0 0;background-color:#fff;
    background-image:linear-gradient(to bottom,transparent 0 3px,rgba(28,27,27,.10) 3px 9px,transparent 9px);
    pointer-events:none
  }
  .sw-hoja:nth-of-type(even){background-color:var(--tinte,#F5F0E8)}
  .sw-tab{
    position:absolute;z-index:6;left:12px;top:-40px;height:40px;max-width:calc(100% - 24px);display:flex;align-items:center;gap:6px;padding:0 14px 0 10px;
    background:var(--cat,#E0DCD2);border:2px solid #1C1B1B;border-bottom:0;border-radius:12px 12px 0 0;
    font-size:13px;font-weight:800;color:#1C1B1B;white-space:nowrap
  }
  .sw-tab img,.sw-tab .cemo{flex:none;width:18px;height:18px;font-size:16px}

  .sw-cscroll{height:100%;overflow-y:auto;overflow-x:hidden;padding:18px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:none}   /* none: sin desborde el scroller no le roba el gesto a la card (el navegador cancelaba el arrastre a los 2 moves) */

  .snz-toast{
    position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:60;max-width:440px;margin:0 auto;overflow:hidden;
    border:2px solid #1C1B1B;border-radius:12px;background:#FFF1C7;color:#1C1B1B;font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;

  @keyframes snz-sube{from{transform:translateY(100%)}to{transform:none}}

  @keyframes snz-barra{from{transform:scaleX(1)}to{transform:scaleX(0)}}

  armarTandas(filas).entradas.forEach(function(f){
    if(f.dormida) return;   // las dormidas viven en «Snoozeadas» del home
    var edad = ahora - ms(f.created_at);
    if(f.estado === 'esperando'){
      esperan.push(f);
    } else if(f.estado === 'abierta'){
      (edad > SIETE_DIAS ? viejas : abiertas).push(f);
    } else if(f.estado === 'decidida' || f.estado === 'recibida'){
      enCurso.push(f);
    } else if(f.estado === 'aplicada' || f.estado === 'respondida_en_chat'){
      var cuando = ms(f.applied_at) || ms(f.updated_at) || ms(f.created_at);
      if(ahora - cuando <= SIETE_DIAS) aplicadas.push(f);
    }
  });
  var mapa = {};
  abiertas.forEach(function(f){
    var k = f.session_id || '__sin__';
    (mapa[k] = mapa[k] || {key:k, filas:[]}).filas.push(f);
  });
  var grupos = Object.keys(mapa).map(function(k){
    var g = mapa[k];
    g.filas.sort(function(a,b){ return ms(b.created_at) - ms(a.created_at); });
    var reciente = g.filas[0];
    g.titulo = k === '__sin__' ? 'Sin sesión' : (reciente.sesion_titulo || reciente.skill || 'Sesión');
    g.session_id = k === '__sin__' ? null : k;
    g.abiertos = g.filas.reduce(function(s,f){ return s + (Number(f.pendientes) || 0); }, 0);
    g.orden = ms(reciente.created_at);
    return g;
  });
  grupos.sort(function(a,b){ return b.orden - a.orden; });
  enCurso.sort(function(a,b){ return (ms(b.decided_at)||ms(b.updated_at)||ms(b.created_at)) - (ms(a.decided_at)||ms(a.updated_at)||ms(a.created_at)); });
  aplicadas.sort(function(a,b){ return (ms(b.applied_at)||ms(b.updated_at)) - (ms(a.applied_at)||ms(a.updated_at)); });
  viejas.sort(function(a,b){ return ms(b.created_at) - ms(a.created_at); });
  esperan.sort(function(a,b){ return (ms(a.esperando_at)||ms(a.updated_at)) - (ms(b.esperando_at)||ms(b.updated_at)); }); // la que hace mas que espera, primero
  return {esperan:esperan, grupos:grupos, enCurso:enCurso, aplicadas:aplicadas, viejas:viejas};
}

/* ---------- token (localStorage, siempre con try/catch) ---------- */
function leerToken(){ try{ return localStorage.getItem(CLAVE_TOKEN) || null; }catch(e){ return null; } }
function guardarToken(t){ try{ localStorage.setItem(CLAVE_TOKEN, t); }catch(e){} }
function borrarToken(){ try{ localStorage.removeItem(CLAVE_TOKEN); }catch(e){} }
function tokenMalo(err){ return !!(err && /token inv[aá]lido/i.test(String(err.message || err))); }

// token vencido o borrado: se limpia todo y se vuelve a pedir el PIN
function sesionVencida(){
  detenerVivo();
  borrarToken();
  estado.token = null; estado.snzLocal = {}; estado.listaApl = 0; estado.filas = []; estado.sel = null; estado.vivo = null; estado.orig = null; estado.panelKey = null; estado.decidido = null; estado.pend = null; estado.errores = []; pestanasReset();   // Bloqueos y sus errores son de la sesion que se cierra
  segReset();   // Seguimiento: archivados pendientes, pedidos y En vuelo tambien son de esa sesion

/* ---------- pantalla del PIN ---------- */
// el bloqueo por intentos es temporal: la base puede traer `espera_seg` (segundos) o `hasta` (fecha); sin ninguno, solo el aviso general
function bloqueoTxt(d){
  var s = Number(d && d.espera_seg);
  if(!(s > 0) && d && d.hasta){ var t = ms(d.hasta); s = t ? Math.ceil((t - Date.now()) / 1000) : 0; }
  var m = s > 0 ? Math.ceil(s / 60) : 0;
  var cuando = m > 0 ? (m < 60 ? 'en ' + m + (m === 1 ? ' minuto' : ' minutos') : 'en ' + Math.ceil(m / 60) + (Math.ceil(m / 60) === 1 ? ' hora' : ' horas')) : 'más tarde';
  return 'Demasiados intentos. Probá de nuevo ' + cuando + '. Se puede levantar antes con pin.py desbloquear desde la compu.';
}
function vistaEntrada(msg, esErr){
  swipeDesmontar(); estado.swd = null; estado.hd = {}; estado.listaCargada = false; estado.homeVisto = false; estado.homeEnvs = {}; estado.homeEnviando = false; estado.festejo = null;
  document.body.classList.remove('con-barra');
  raiz.innerHTML =
    '<div class="entrada">' +
      '<h1>Botonera</h1>' +
      '<p>Poné tu PIN.</p>' +
      '<form id="f-pin" autocomplete="off">' +
        '<input class="pin" id="i-pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" ' +
          'autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" ' +
          'aria-label="PIN de 4 dígitos" autofocus>' +
        '<button class="btn primario" type="submit" id="b-pin">Entrar</button>' +
      '</form>' +
      '<div class="aviso' + (esErr ? ' err' : '') + '" id="aviso" role="status">' + esc(msg || '') + '</div>' +
    '</div>';
  var aviso = document.getElementById('aviso');
  var inp = document.getElementById('i-pin');
  var btn = document.getElementById('b-pin');
  var enviando = false;
  function di(t, cls){ aviso.className = 'aviso' + (cls ? ' ' + cls : ''); aviso.textContent = t; }
  function libre(){ enviando = false; inp.disabled = false; btn.disabled = false; inp.value = ''; inp.focus(); }
  function enviar(){
    if(enviando) return;
    var pin = inp.value;
    if(!/^[0-9]{4}$/.test(pin)){ di('Son 4 dígitos.', 'err'); inp.focus(); return; }
    enviando = true; inp.disabled = true; btn.disabled = true; di('');
    sb.rpc('bm_entrar', {p_pin: pin}).then(function(r){
      if(r.error || !r.data){ di('No pude conectar. Probá de nuevo.', 'err'); libre(); return; }
      var d = r.data;
      if(d.ok && d.token){
        guardarToken(d.token);
        estado.token = d.token;
        vistaApp();
        return;
      }
      if(d.motivo === 'pin_incorrecto'){
        var n = Math.max(0, MAX_FALLOS - (Number(d.fallos) || 0));
        di('PIN incorrecto. ' + (n === 1 ? 'Te queda 1 intento.' : 'Te quedan ' + n + ' intentos.'), 'err');
      } else if(d.motivo === 'bloqueado'){
        di(bloqueoTxt(d), 'err');
      } else if(d.motivo === 'sin_pin'){
        di('Todavía no hay PIN puesto.', 'err');
      } else {
        di('No pude entrar. Probá de nuevo.', 'err');
      }
      libre();
    }, function(){ di('No pude conectar. Probá de nuevo.', 'err'); libre(); });
  }
  inp.addEventListener('input', function(){
    var limpio = inp.value.replace(/[^0-9]/g, '').slice(0, 4);
    if(limpio !== inp.value) inp.value = limpio;
    if(limpio.length === 4) enviar();
  });
  document.getElementById('f-pin').onsubmit = function(e){ e.preventDefault(); enviar(); };
  inp.focus();
}

function salir(){
  var t = estado.token;

  segReset();
  vistaEntrada();

}

function cargarLista(){
  var token = estado.token;
  if(!token) return Promise.resolve();
  segCargar();          // Sesiones: «En vuelo», en cada poll
  var seq = estado.listaSeq = (estado.listaSeq || 0) + 1;   // numero de pedido: una respuesta pedida antes de un snooze/despertar no lo pisa (snzLocal)
  return sb.rpc('bm_lista', {p_token: token})
    .then(function(r){
      if(token !== estado.token) return; // salio o cambio de sesion mientras tanto
      if(seq < (estado.listaApl || 0)) return;   // llego una mas nueva antes que esta: esta ya es vieja
      if(r.error){
        if(tokenMalo(r.error)) sesionVencida(); else console.warn('lista', r.error);
        return;
      }
      estado.filas = r.data || [];
      estado.listaApl = seq;
      snzAplicarLocal(seq);   // lo que snoozeaste o despertaste aca y esta respuesta (pedida antes) todavia no sabe
      estado.listaCargada = true;
      limpiarMarcas();
      snzSacarDormidas();   // una que paso a dormida desde otro dispositivo sale del mazo abierto
      pintarLista();
      homeCargar();
      accionesCargar(false); erroresCargar();   // Bloqueos se pide con la lista, con su tope de tiempo
      homePintar();
      pintarPanel(false);
    }, function(err){ console.warn('lista', err); });
}

    g.filas.forEach(function(f){ h += itemHTML(f, false); });

  // lo que ya no falta decidir va abajo, plegado

    filas.forEach(function(f){ d += itemHTML(f, true); });

  }
  var listas = {encurso: ag.enCurso, aplicadas: ag.aplicadas, viejas: ag.viejas};
  h += plegable('encurso', 'En curso', ag.enCurso);

  h += plegable('viejas', 'Viejas', ag.viejas);
  // conservar lo que dejo la persona (por data-k, no por posicion); sin decision suya, abre solo el que tiene la seleccionada

// un paso sin fecha con uno posterior hecho no esta «pendiente»: se salteo o no se registro

function pasosHTML(f, modo, largo){
  var ps = [['Decidido', f.decided_at], ['Llegó a la sesión', f.received_at], ['Aplicado', f.applied_at]];
  return ps.map(function(p, i){

    }
    if(i === 2 && modo === 'espera' && !p[1]){
      return '<div class="paso espera-p"><div class="n">Aplicado</div><div class="h">Te espera</div></div>';
    }
    var posterior = ps.slice(i + 1).some(function(q){ return q[1]; });
    return paso(p[0], p[1], posterior);
  }).join('');

function cabeceraHTML(t){
  var f = t.entrada, meta = [];
  // la tira sigue la prioridad de la tanda: esperando > abierta > trabajando > ultima vuelta
  // con una vuelta abierta el estado de la cabecera es el de la ultima vuelta DECIDIDA, no el «Pendiente» de la abierta
  var fp = f, modo = null;
  if(t.esperando){ fp = t.esperando; modo = 'espera'; }
  else if(t.abierta){ if(t.abierta.clave !== t.base){ var vd = vueltasDecididas(t); if(vd.length) fp = vd[vd.length - 1]; } }
  else if(t.trabajando){ fp = t.trabajando; modo = 'trab'; }
  var url = urlSesion(f.session_id);
  var link = url ? ' <a class="lnk-ses" href="' + esc(url) + '">Abrir la conversación ↗</a>' : '';
  if(f.sesion_titulo) meta.push('Sesión <b>' + esc(f.sesion_titulo) + '</b>' + link);
  else if(link) meta.push(link.trim());
  if(f.skill) meta.push('Skill <b>' + esc(f.skill) + '</b>');
  if(f.proyecto) meta.push('Proyecto <b>' + esc(f.proyecto) + '</b>');
  meta.push(esc(itemsTxt(f.n_items)));
  meta.push('Creada ' + esc(hora((t.baseFila || t.vueltas[0]).created_at)));

    meta.map(function(m){ return '<span>' + m + '</span>'; }).join('') + '</div>' +
    '<div class="pasos">' + pasosHTML(fp, modo, modo === 'trab' && trabajoLargo(f)) + '</div></div>' +
    (t.esperando ? esperaHTML(f) : '');
}

/* ---------- «Lo que decidiste»: la respuesta guardada, en lectura ---------- */
// respuesta_texto: una linea por item «N. marca · titulo → accion [· comentario: …]» + una linea «Notas: …» opcional
// una marca que no se liste aca se pega como comentario del item anterior
var RE_LINEA = /^(\d+)\.\s*(no va|va con cambios|va|sin marcar|comentario|revisado|rot|después|no entiendo|ya está hecho|eligió [^·]*?)\s*·\s*(.*)$/i;
function marcaVa(m){ return m === 'va' || m === 'va con cambios' || m === 'revisado' || /^eligió /.test(m); }
function marcaAbierta(m){ return m === 'sin marcar' || m === 'comentario' || m === 'rot'; } // comentar o pedir /rot no decide: la card sigue abierta
function parsearRespuesta(txt){
  var items = [], notas = [], ultimo = null, enNota = false;
  String(txt).split(/\r?\n/).forEach(function(raw){
    var l = raw.trim(); if(!l) return;
    var m = RE_LINEA.exec(l);
    if(m){
      var resto = m[3], coment = '', campos = '';
      var k = resto.search(/\s*·\s*comentario:\s*/i);
      if(k >= 0){ coment = resto.slice(k).replace(/^\s*·\s*comentario:\s*/i, ''); resto = resto.slice(0, k); }
      var esRegla = /\s*·\s*regla\s*$/i.test(resto); if(esRegla) resto = resto.replace(/\s*·\s*regla\s*$/i, '');   // «Esto es regla», pegado antes del comentario
      var kc = resto.search(/\s*·\s*campos:\s*/i);   // Editar: «· campos: id=nuevo (antes viejo); …», entre la acción y el comentario
      if(kc >= 0){ campos = resto.slice(kc).replace(/^\s*·\s*campos:\s*/i, ''); resto = resto.slice(0, kc); }
      var j = resto.indexOf(' → ');
      ultimo = {n: m[1], marca: m[2].toLowerCase(), titulo: (j >= 0 ? resto.slice(0, j) : resto).trim(),
                accion: j >= 0 ? resto.slice(j + 3).trim() : '', campos: campos.trim(), comentario: coment.trim(), regla: esRegla};
      items.push(ultimo); enNota = false; return;
    }
    var n = /^Notas:\s*(.*)$/i.exec(l);
    if(n){ notas.push(n[1]); enNota = true; return; }
    if(/^\/botonera respuesta/i.test(l)) return;
    // linea suelta: sigue a lo anterior (notas o comentario del ultimo item)
    if(enNota) notas.push(l);
    else if(ultimo) ultimo.comentario = (ultimo.comentario ? ultimo.comentario + ' ' : '') + l;
  });

}

function recoVa(it){ return /^va$/i.test(String(it.reco || '').trim()); }
// marcas en curso de la vuelta: {items:{n:{m:'go'|'no'|'', c}}, notas}, en memoria + localStorage por clave de la vuelta
// go/no de siempre; vc (va con cambios), de (después) y op (eligió, con o = ids). ne/yh (no entiendo, ya está hecho) quedan de las
var MARCAS = {go: 1, no: 1, vc: 1, ne: 1, yh: 1, de: 1, op: 1, co: 1, ro: 1, rv: 1};   // ro = /rot: pide que la sesión vuelva a explicar la card
function marcaDe(clave, n){
  var mk = estado.marcas[clave], v = mk && mk.items && mk.items[n];
  var r = {m: v && MARCAS[v.m] ? v.m : '', c: v && typeof v.c === 'string' ? v.c : ''};
  if(v && Array.isArray(v.o)) r.o = v.o.filter(function(x){ return typeof x === 'string'; });
  if(v && v.f && typeof v.f === 'object' && !Array.isArray(v.f)) r.f = v.f;   // Editar: {id del campo: valor nuevo}, solo los que cambiaron
  if(v && v.r === true) r.r = true;   // «Esto es regla»: la sesión escribe la decisión en el Log del proyecto
  return r;
}

// el texto de la respuesta: el MISMO formato que respuesta() de la plantilla, con la clave y los n/titulos de la VUELTA
function respuestaVuelta(p){
  var L = ['/botonera respuesta · ' + p.clave];
  p.items.forEach(function(it){
    var st = marcaDe(p.clave, it.n), ids = st.m === 'op' ? (st.o || []) : [];
    // Editar guarda los campos al escribir: un Va (botón, swipe o flecha) con cambios sin confirmar sale como «va con cambios» (no se pierden)
    var cf = st.m === 'go' || st.m === 'vc' || st.m === 'op' ? mqCamposTxt(it, st.f) : '';
    if(st.m === 'go' && cf) st.m = 'vc';
    var m = st.m === 'go' ? 'va' : st.m === 'no' ? 'no va' : st.m === 'vc' ? 'va con cambios' : st.m === 'ne' ? 'no entiendo' :
      st.m === 'yh' ? 'ya está hecho' : st.m === 'de' ? 'después' : st.m === 'rv' ? 'revisado' : st.m === 'co' ? 'comentario' : st.m === 'ro' ? 'rot' : st.m === 'op' ? 'eligió ' + ids.join(', ') : 'sin marcar';
    var acc = st.m === 'go' || st.m === 'vc' ? it.accion_va : st.m === 'no' ? it.accion_no_va : st.m === 'op' ? ids.map(function(id){ return mqEtiqueta(it, id); }).join(', ') :
      st.m === 'ro' ? rotEtiquetas(st.o) : '';   // /rot: «N. rot · título → Dibujo corto + Otro ejemplo»
    // «Esto es regla» solo cuenta con una decisión de verdad (va, no va, con cambios, eligió): va justo antes del comentario
    var regla = st.r && (st.m === 'go' || st.m === 'no' || st.m === 'vc' || st.m === 'op') ? ' · regla' : '';
    L.push(it.n + '. ' + m + ' · ' + it.titulo + (acc ? ' → ' + acc : '') + (cf ? ' · campos: ' + cf : '') + regla + (st.c && st.c.trim() ? ' · comentario: ' + st.c.trim() : ''));
  });

}
window.__respuestaParse = {parsear: parsearRespuesta, abierta: marcaAbierta};   // solo para pruebas locales: cómo se lee una línea «N. rot · …» al volver

// junta las vueltas ya decididas (en orden): un item aparece UNA vez, con lo ultimo que se decidio de el (match por titulo exacto)
function juntarVueltas(parsed){
  var todos = [];
  parsed.forEach(function(x, vi){
    x.p.items.forEach(function(it){
      var marcado = !marcaAbierta(it.marca), e = null;
      for(var i = 0; i < todos.length; i++){
        if(todos[i].vi < vi && todos[i].it.titulo === it.titulo){ e = todos[i]; break; }
      }
      if(e){
        if(!marcaAbierta(e.it.marca) && !marcado) return; // ya estaba decidido: un «sin marcar» o un comentario posterior no lo pisa
        var n = e.it.n; e.vi = vi; e.it = it; it.n = n;      // hereda el numero de la botonera donde nacio
        return;
      }
      if(vi > 0) it.n = ''; // item nuevo de una vuelta: su numero local chocaria con los de la original
      todos.push({vi: vi, it: it});
    });
  });
  var its = todos.map(function(x){ return x.it; });
  return {
    decididos: its.filter(function(it){ return !marcaAbierta(it.marca); }),
    faltan: its.filter(function(it){ return marcaAbierta(it.marca); })
  };
}

function vueltasDecididas(t){ return t.vueltas.filter(function(v){ return v.estado !== 'abierta'; }); }
function llaveFila(v){ return v.clave + '|' + v.estado + '|' + v.updated_at; }

// UN solo bloque: arriba lo pendiente (filas activas si hay una vuelta abierta; en lectura si no), abajo lo decidido.
// pend = estado.pend de la vuelta abierta (ya cargado), o null
function decididoHTML(t, datos, pend){
  var h = '', vs = vueltasDecididas(t), parsed = [], resumenes = [], notas = [];
  vs.forEach(function(v){
    var dd = datos[v.clave], d = dd && dd.d; if(!d) return;
    var rot = vs.length > 1 ? ' · ' + ordinal(numVuelta(v)) + ' vuelta' : '';
    var txt = d.respuesta_texto;
    if(txt != null && String(txt).trim()){
      var p = parsearRespuesta(txt);
      parsed.push({v: v, p: p});
      if(p.notas) notas.push({rot: rot, txt: p.notas});
    }
    if(d.resumen_aplicado && String(d.resumen_aplicado).trim()) resumenes.push({rot: rot, txt: d.resumen_aplicado});
  });
  var j = parsed.length ? juntarVueltas(parsed) : {decididos: [], faltan: []};
  var decididos = j.decididos;
  // primero los va, despues los no va (estable: dentro de cada grupo queda el orden original)
  decididos = decididos.filter(function(it){ return marcaVa(it.marca); })
    .concat(decididos.filter(function(it){ return !marcaVa(it.marca); }));
  var conItems = parsed.some(function(x){ return x.p.items.length; });
  var activa = !!pend;                               // hay una vuelta abierta con sus items cargados
  var nPend = activa ? pend.items.length : j.faltan.length;

  h += '<div class="dec"><div class="dec-t">' + (nPend ? 'Por decidir (' + nPend + ')' : 'Lo que decidiste') + '</div>';
  var sub = [];
  if(nPend) sub.push(nPend + ' por decidir');
  if(conItems){
    var c = {va: 0, 'no va': 0};
    decididos.forEach(function(it){ if(marcaVa(it.marca)) c.va++; else if(it.marca === 'no va') c['no va']++; });
    sub.push(c.va + ' va', c['no va'] + ' no va');
  }
  if(sub.length) h += '<div class="dec-sub">' + sub.join(' · ') + '</div>';

  // --- lo pendiente, arriba
  if(activa){
    h += introVueltaHTML(pend.d);
    // el numero es el de la tanda ORIGINAL: se matchea el titulo con el del item sin marcar de la base; si no matchea, el de la vuelta
    var usados = {};
    var bloq = !!pend.envio && (pend.envio.st === 'enviando' || pend.envio.st === 'ok');
    var sinMarcar = 0;
    pend.items.forEach(function(it){
      var nShow = it.n;
      for(var i = 0; i < j.faltan.length; i++){
        if(!usados[i] && j.faltan[i].titulo === it.titulo && j.faltan[i].n !== ''){ usados[i] = true; nShow = j.faltan[i].n; break; }
      }
      if(!marcaDe(pend.clave, it.n).m) sinMarcar++;
      h += pendActivaHTML(it, nShow, pend.clave, bloq);

    h += barraPendHTML(pend, sinMarcar);
  } else if(j.faltan.length){
    j.faltan.forEach(function(it){ h += pendLecturaHTML(it); });
    h += '<div class="p-sub">La sesión te los vuelve a traer.' +
      (url ? '<a class="lnk-ses" href="' + esc(url) + '">Abrir la conversación ↗</a>' : '') + '</div>';
  }

  // --- lo decidido, abajo
  if(!parsed.length){
    if(!nPend){
      var ult = vs[vs.length - 1];
      h += '<div class="dec-vacio">' + (ult && ult.estado === 'respondida_en_chat' ? 'La respondiste en el chat.' : 'No hay una respuesta guardada.') + '</div>';
    }
  } else if(conItems){
    if(!decididos.length && !nPend) h += '<div class="dec-vacio">Todavía no decidiste ninguno.</div>';
    decididos.forEach(function(it){
      var cls = marcaVa(it.marca) ? 'go' : it.marca === 'no va' ? 'no' : 'mudo';
      h += '<div class="dec-fila"><span class="dec-n">' + esc(it.n) + '</span>' +
        '<span class="pill ' + cls + '">' + esc(/^eligió /.test(it.marca) ? 'eligió' : it.marca === 'después' ? 'después' : it.marca) + '</span>' +
        '<div class="dec-x"><div>' + esc(it.titulo) + '</div>' +
        (it.accion ? '<div class="a">→ ' + esc(it.accion) + '</div>' : '') +
        (it.campos ? '<div class="c"><b>Cambios:</b> ' + esc(it.campos) + '</div>' : '') +
        (it.comentario ? '<div class="c"><b>Comentario:</b> ' + esc(it.comentario) + '</div>' : '') +
        '</div></div>';
    });
  } else {
    // formato que no se reconoce: se muestra tal cual
    h += '<div class="dec-txt">' + parsed.map(function(x){ return lineasHTML(x.p.crudo); }).join('') + '</div>';
  }
  notas.forEach(function(n){
    h += '<div class="dec-sec"><div class="dec-t">Notas' + esc(n.rot) + '</div><div class="dec-txt">' + lineasHTML(n.txt) + '</div></div>';
  });
  h += '</div>';
  resumenes.forEach(function(r){
    h += '<div class="dec"><div class="dec-t">Qué hizo la sesión' + esc(r.rot) + '</div><div class="dec-txt">' + lineasHTML(r.txt) + '</div></div>';
  });
  return h;
}

// la vuelta abierta (si la hay y NO es la original) con sus items ya cargados; si no, null

  var sig = [listo ? 1 : 0, dd.error ? 1 : 0, p && p.error ? 1 : 0,
    vs.map(function(v){ return dd.datos[v.clave] ? dd.datos[v.clave].k : '-'; }).join(','),
    vuelta ? llaveFila(ab) : '', p ? p.k : '', estado.pendVer, t.entrada.session_id || ''].join('|');
  if(el.getAttribute('data-sig') === sig) return; // sin cambios: no se repinta (no se pierde el foco ni lo que se escribe)

  var af = document.activeElement;

  if(listo) h = decididoHTML(t, dd.datos, vuelta ? p : null);
  else if(dd.error || (p && p.error)) h = '<div class="dec"><div class="dec-vacio">No pude traer lo que falta decidir y lo que decidiste. Se reintenta solo.</div></div>';
  else h = '<div class="dec"><div class="dec-vacio">Cargando…</div></div>';
  el.setAttribute('data-sig', sig);
  el.innerHTML = h;
}
function pendCambio(){ estado.pendVer++; pintarDecidido(true); }

function alClickDec(e){
  var tg = e.target; if(!tg || !tg.closest) return;
  var b = tg.closest('[data-pm]');
  if(b){
    var p = pendVigente(); if(!p || (p.envio && (p.envio.st === 'enviando' || p.envio.st === 'ok'))) return;
    var n = b.getAttribute('data-pn'), m = b.getAttribute('data-pm');
    setMarca(p.clave, n, 'm', marcaDe(p.clave, n).m === m ? '' : m);
    pendCambio();
    return;
  }
  if(tg.closest('[data-envio]')) enviarVuelta();
}
function alInputDec(e){
  var i = e.target;
  if(!i || !i.classList || !i.classList.contains('pcom')) return;
  var p = pendVigente(); if(!p) return;
  setMarca(p.clave, i.getAttribute('data-pn'), 'c', i.value);
}

// manda la respuesta de la vuelta abierta: bm_decidir_pin con la clave de la VUELTA y su updated_at
function enviarVuelta(){
  var p = pendVigente(); if(!p) return;
  var clave = p.clave;
  if(estado.bloqueadas[clave]) return;
  var token = estado.token; if(!token) return;
  estado.bloqueadas[clave] = true;
  p.envio = {st: 'enviando', msg: ''}; pendCambio();
  function falla(msg){ estado.bloqueadas[clave] = false; p.envio = {st: 'error', msg: msg}; pendCambio(); }
  sb.rpc('bm_decidir_pin', {p_token: token, p_clave: clave, p_respuesta: respuestaVuelta(p), p_version: p.d.updated_at || null})
    .then(function(r){
      estado.bloqueadas[clave] = false;
      if(token !== estado.token) return;
      if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
      if(r.error){ falla(r.error.message || 'No se pudo enviar'); return; }
      if(r.data === 'decidida'){
        p.envio = {st: 'ok', msg: ''}; pendCambio();
        cargarLista().then(function(){ delete estado.marcas[clave]; persistirMarcas(); });
      } else if(r.data === 'cambio'){
        p.envio = {st: 'error', msg: 'La tanda cambió mientras decidías.'}; p.k = null; pendCambio();
        cargarLista().then(function(){ var tt = tandaSel(); if(tt) sincronizarPend(tt); });
      } else {
        p.envio = {st: 'error', msg: 'Ya estaba ' + r.data}; pendCambio(); cargarLista();
      }
    }, function(err){ if(token === estado.token) falla((err && err.message) || 'No se pudo enviar'); });
}

// trae respuesta_texto y resumen_aplicado (bm_fila) de cada vuelta decidida, una vez por clave+estado+updated_at
function sincronizarDecidido(t){
  var dd = estado.decidido;
  if(!dd || dd.base !== t.base) dd = estado.decidido = {base: t.base, datos: {}, error: false, enVuelo: {}};
  var token = estado.token; if(!token) return;
  vueltasDecididas(t).forEach(function(v){
    var k = llaveFila(v), cur = dd.datos[v.clave];
    if((cur && cur.k === k) || dd.enVuelo[v.clave] === k) return;
    dd.enVuelo[v.clave] = k;
    function suelto(){ if(dd.enVuelo[v.clave] === k) delete dd.enVuelo[v.clave]; }
    sb.rpc('bm_fila', {p_token: token, p_clave: v.clave}).then(function(r){
      if(token !== estado.token) return;
      if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
      if(estado.decidido !== dd) return; // cambio la seleccion mientras tanto
      suelto();
      var d = Array.isArray(r.data) ? r.data[0] : r.data;
      if(r.error || !d){ console.warn('decidido', r.error); dd.error = true; }
      else { dd.datos[v.clave] = {k: k, d: d}; dd.error = false; }
      pintarDecidido();
    }, function(err){
      suelto();
      if(estado.decidido === dd){ console.warn('decidido', err); dd.error = true; pintarDecidido(); }
    });
  });
}

// trae los items de la vuelta abierta (bm_fila → datos), una vez por clave+estado+updated_at
function sincronizarPend(t){
  var ab = t.abierta;
  if(!ab || ab.clave === t.base){ estado.pend = null; return; }
  var token = estado.token; if(!token) return;
  var k = llaveFila(ab), p = estado.pend;
  if(!p || p.clave !== ab.clave){ p = estado.pend = {base: t.base, clave: ab.clave, k: null, d: null, items: [], error: false, enVuelo: null, envio: null}; estado.pendVer++; }
  if(p.k === k || p.enVuelo === k) return;
  p.enVuelo = k;
  sb.rpc('bm_fila', {p_token: token, p_clave: ab.clave}).then(function(r){
    if(token !== estado.token) return;
    if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
    if(estado.pend !== p) return; // cambio la seleccion mientras tanto
    if(p.enVuelo === k) p.enVuelo = null;
    var d = Array.isArray(r.data) ? r.data[0] : r.data;
    if(r.error || !d){ console.warn('pendiente', r.error); p.error = true; }
    else { p.k = k; p.d = d; p.items = itemsDeVuelta(d); p.error = false; }
    estado.pendVer++;
    pintarDecidido();
  }, function(err){
    if(p.enVuelo === k) p.enVuelo = null;
    if(estado.pend === p){ console.warn('pendiente', err); p.error = true; estado.pendVer++; pintarDecidido(); }
  });
}

// la botonera original (la de la base), solo si la piden: el iframe se crea recien al abrir el <details>
function abrirOriginal(det){
  if(!det.open || estado.orig) return;
  var t = tandaSel(); if(!t || !t.baseFila) return;
  var marco = document.getElementById('orig-marco'); if(!marco) return;
  var iframe = document.createElement('iframe');
  iframe.id = 'marco-orig'; iframe.title = 'Botonera original';
  iframe.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox');
  marco.appendChild(iframe);
  estado.orig = nuevoSlot(iframe, t.baseFila.clave);
  sincronizarIframe(estado.orig, t.baseFila);
}
function nuevoSlot(iframe, clave){ return {iframe: iframe, clave: clave, cargado: null, recargar: false, errorAlCargar: null}; }

function pintarPanel(nueva){
  var el = document.getElementById('panel'); if(!el) return;
  modoDetalle();
  var t = tandaSel();
  if(!estado.sel || !t){
    if(estado.sel && !t && estado.filas.length === 0){ el.innerHTML = '<div class="panel-vacio">Cargando…</div>'; return; }
    swipeDesmontarUna();
    el.innerHTML = '<div class="panel-vacio">Elegí una botonera de la lista.</div>';
    estado.vivo = null; estado.orig = null; estado.panelKey = null; estado.decidido = null; estado.pend = null; estado.pend = null;
    return;
  }
  var ab = t.abierta;                          // la vuelta abierta (la que se decide ahora), o null
  var vuelta = !!ab && ab.clave !== t.base;    // abierta pero NO es la original: sus items son filas del bloque unico
  if(ab) swipeCargar(t);                       // trae los datos del swipe (asincrono): decide si aparece el boton
  var swOn = swipeActivo(t) && !(estado.sw && estado.sw.multi);   // modo swipe: reemplaza al iframe y al bloque (con el mazo del home montado no se pisa)
  var swEsp = !swOn && swipeEspera(t);         // swipe prendido y los datos todavia no llegaron: ni iframe ni bloque
  var iframeVivo = !!ab && !vuelta && !swOn && !swEsp;   // tanda sin vueltas y abierta: se decide en la botonera de la plantilla (iframe)
  var conDec = (!ab || vuelta) && !swOn && !swEsp;       // hay un bloque (pendiente + decidido) para mostrar
  var pk = t.base + '|' + (ab ? 'a:' + ab.clave : 'd') + (swOn ? '|sw' : swEsp ? '|sp' : '');
  // se rearma si cambio la tanda o la vuelta abierta, o si falta el DOM
  var falta = (iframeVivo && (!estado.vivo || !document.body.contains(estado.vivo.iframe))) || (conDec && !document.getElementById('dec')) ||
    (swOn && (!estado.sw || !document.body.contains(estado.sw.el)));
  if(nueva || estado.panelKey !== pk || falta){
    estado.panelKey = pk;
    swipeDesmontarUna();
    estado.vivo = null; estado.orig = null; estado.decidido = null; estado.pend = null; estado.pend = null;
    var h = '<button class="btn volver" id="b-lista" type="button">‹ Lista</button><div id="cab"></div>';
    if(iframeVivo) h += '<div class="marco"><iframe id="marco" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" title="Botonera"></iframe></div>';
    if(conDec){
      h += '<div id="dec"></div>';
      if(t.baseFila) h += '<details class="plegable" id="orig"><summary>Ver la botonera original</summary><div class="marco orig" id="orig-marco"></div></details>';
    }
    if(swEsp) h += '<div class="vacio">Cargando…</div>';
    el.innerHTML = h;
    if(iframeVivo){
      estado.vivo = nuevoSlot(document.getElementById('marco'), ab.clave);
      if(window.ResizeObserver){ try{ new ResizeObserver(medirMarco).observe(document.getElementById('cab')); }catch(e){} }
    }
    var decEl = document.getElementById('dec');
    if(decEl){
      decEl.addEventListener('click', alClickDec); decEl.addEventListener('input', alInputDec);
      decEl.addEventListener('toggle', function(e){ var k = e.target.getAttribute && e.target.getAttribute('data-det'); if(k) estado.detAbierto[k] = e.target.open; }, true);
    }
    var det = document.getElementById('orig');
    if(det) det.addEventListener('toggle', function(){ abrirOriginal(det); });
    document.getElementById('b-lista').addEventListener('click', volverALista);
    if(swOn) swipeMontar();
  }
  document.getElementById('cab').innerHTML = cabeceraHTML(t);
  if(iframeVivo){ medirMarco(); sincronizarIframe(estado.vivo, ab); }
  if(conDec){ sincronizarDecidido(t); sincronizarPend(t); pintarDecidido(); }
  if(estado.orig && t.baseFila) sincronizarIframe(estado.orig, t.baseFila);
}

// alto del iframe = viewport menos lo que hay arriba de el: asi la barra de envio queda siempre a la vista
function medirMarco(){
  var m = document.getElementById('marco'), p = document.getElementById('panel');
  if(!m || !p) return;
  var rm = m.getBoundingClientRect(), rp = p.getBoundingClientRect();
  var ancho = window.matchMedia('(min-width: 860px)').matches;
  var fuera = ancho ? rp.top + window.pageYOffset : 0; // en pantalla ancha, la barra de arriba; en angosta el panel se alinea al tope
  document.documentElement.style.setProperty('--ocupado', Math.ceil((rm.top - rp.top) + fuera + 18) + 'px');
}
window.addEventListener('resize', medirMarco);

function filaPorClave(clave){
  return estado.filas.filter(function(f){ return f.clave === clave; })[0] || null;
}
function slotVigente(slot){ return !!slot && (slot === estado.vivo || slot === estado.orig); }

// slot = {iframe, clave, cargado, ...}: el iframe de la vuelta abierta (estado.vivo) o el de la original (estado.orig); f = la fila de esa clave
function sincronizarIframe(slot, f){
  if(!slot || !slot.iframe) return;
  var clave = f.clave, iframe = slot.iframe;
  var c = slot.cargado;
  var forzar = slot.recargar === clave;
  if(!forzar && c && c.clave === clave && c.updated_at === f.updated_at) return;
  if(c && c.clave === clave){
    // cambio la fila: avisar el estado y recargar el html solo si cambio
    if(c.estado !== f.estado) avisarEstado(slot, f);
    c.estado = f.estado;
  }
  var token = estado.token; if(!token) return;
  sb.rpc('bm_fila', {p_token: token, p_clave: clave}).then(function(r){
    if(token !== estado.token) return;
    if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
    // el fetch pudo quedar viejo (A -> B -> A): vale solo si el slot, su clave y su iframe siguen siendo los de ahora
    if(!slotVigente(slot) || slot.clave !== clave || iframe !== slot.iframe) return;
    var d = Array.isArray(r.data) ? r.data[0] : r.data;
    if(r.error || !d){ console.warn('html', r.error); return; }
    var cur = slot.cargado;
    var recargar = slot.recargar === clave;
    if(!recargar && cur && cur.clave === clave && cur.html === d.html){
      cur.updated_at = d.updated_at; cur.estado = f.estado; return;
    }
    if(recargar) slot.recargar = false;
    var vigente = filaPorClave(clave) || f;
    slot.cargado = {clave: clave, html: d.html, updated_at: d.updated_at, estado: vigente.estado};
    iframe.onload = function(){ alCargarMarco(slot, iframe, clave); };
    iframe.srcdoc = d.html || '';
  }, function(err){ console.warn('html', err); });
}

// al cargar el iframe: primero las marcas, despues el estado, al final el error pendiente (si hubo)
function alCargarMarco(slot, iframe, clave){
  if(!slotVigente(slot) || iframe !== slot.iframe || !iframe.contentWindow) return;
  var w = iframe.contentWindow;
  var mk = estado.marcas[clave];
  if(mk) w.postMessage({tipo:'botonera-marcas', marcas: mk}, '*');
  var f = filaPorClave(clave); if(f) avisarEstado(slot, f);
  if(slot.errorAlCargar){
    w.postMessage({tipo:'botonera-error', motivo: slot.errorAlCargar}, '*');
    slot.errorAlCargar = null;
  }
}

function avisarEstado(slot, f){
  var iframe = slot && slot.iframe;
  if(iframe && iframe.contentWindow) iframe.contentWindow.postMessage({tipo:'botonera-estado', estado: f.estado}, '*');
}

function guardarMarcas(m){
  var mk = m.marcas;
  if(!mk || typeof mk !== 'object' || !mk.items || typeof mk.items !== 'object') return;
  var limpio = {items: mk.items, notas: typeof mk.notas === 'string' ? mk.notas : ''};
  try{ if(JSON.stringify(limpio).length > 200000) return; }catch(_){ return; }
  estado.marcas[m.clave] = limpio;
  persistirMarcas();
}

/* ---------- contrato con el iframe ----------
   Hay hasta dos iframes: el de una tanda SIN vueltas que sigue abierta (estado.vivo: ahi se decide, con la plantilla) y la botonera
   original plegada (estado.orig, solo lectura). Una vuelta abierta («<base>-r2») ya NO va en iframe: sus items son filas del
   bloque unico «Por decidir» (ver decididoHTML / enviarVuelta). La clave del mensaje es la de la botonera del iframe.
   iframe -> pagina : {tipo:'botonera-respuesta', clave, texto}   -> RPC bm_decidir_pin(p_token, p_clave, p_respuesta, p_version)
                      {tipo:'botonera-marcas', clave, marcas:{items, notas}}  -> se guardan por clave (memoria + localStorage)
   pagina -> iframe : {tipo:'botonera-marcas', marcas}   (al cargar, ANTES del estado)
                      {tipo:'botonera-estado', estado}
                      {tipo:'botonera-ok'} | {tipo:'botonera-error', motivo}
   El iframe va con alto fijo de viewport y scroll adentro: ya no se auto-mide. */
window.addEventListener('message', function(e){
  var slot = null;
  [estado.vivo, estado.orig].forEach(function(s){ if(s && s.iframe && e.source === s.iframe.contentWindow) slot = s; });
  if(!slot) return;
  var m = e.data;
  if(!m || typeof m !== 'object') return;
  function responder(o){ try{ e.source.postMessage(o, '*'); }catch(_){} }
  if(m.tipo === 'botonera-marcas'){ if(slot === estado.vivo && m.clave === slot.clave) guardarMarcas(m); return; }
  if(m.tipo !== 'botonera-respuesta') return;
  if(slot !== estado.vivo || m.clave !== slot.clave){ responder({tipo:'botonera-error', motivo:'Esta botonera ya no está abierta en la página'}); return; }
  var clave = m.clave;
  if(estado.bloqueadas[clave]) return;
  estado.bloqueadas[clave] = true;
  // la version es la de la fila con la que se cargo el iframe: si la botonera cambio, la RPC contesta 'cambio'
  var version = (slot.cargado && slot.cargado.clave === clave) ? slot.cargado.updated_at : null;
  var token = estado.token;
  if(!token){ estado.bloqueadas[clave] = false; return; }
  sb.rpc('bm_decidir_pin', {p_token: token, p_clave: clave, p_respuesta: String(m.texto == null ? '' : m.texto), p_version: version})
    .then(function(r){
      estado.bloqueadas[clave] = false;
      if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
      if(r.error){ responder({tipo:'botonera-error', motivo: r.error.message || 'No se pudo enviar'}); return; }
      if(r.data === 'decidida'){ responder({tipo:'botonera-ok'}); cargarLista(); }
      else if(r.data === 'cambio'){
        // recargar el iframe con el html nuevo; el error se muestra cuando termine de cargar
        slot.errorAlCargar = 'La botonera cambió mientras decidías. Recargala.';
        slot.recargar = clave;
        cargarLista().then(function(){ var f = filaPorClave(clave); if(f && slot === estado.vivo && slot.recargar === clave) sincronizarIframe(slot, f); });
      }
      else { responder({tipo:'botonera-error', motivo: 'Ya estaba ' + r.data}); cargarLista(); }
    }, function(err){
      estado.bloqueadas[clave] = false;
      responder({tipo:'botonera-error', motivo: (err && err.message) || 'No se pudo enviar'});
    });
});

/* ---------- vivo: poll cada 15 s con la pestaña visible, mas refresco al volver ---------- */
function arrancarVivo(){
  detenerVivo();
  estado.poll = setInterval(function(){ if(!document.hidden) cargarLista(); }, POLL_MS);
  // los "hace X" se refrescan solos
  estado.reloj = setInterval(function(){
    pintarLista();
    var c = document.getElementById('cab'), t = tandaSel();
    if(c && t) c.innerHTML = cabeceraHTML(t);
  }, 60000);
}
function detenerVivo(){
  if(estado.poll){ clearInterval(estado.poll); estado.poll = null; }
  if(estado.reloj){ clearInterval(estado.reloj); estado.reloj = null; }
}

/* ---------- modo swipe ----------
   Decidir una botonera card por card: derecha = Va, izquierda = No va, arriba = Saltear.
   Funciona para la tanda original abierta (la que se decide en el iframe) y para una vuelta -rN abierta.
   Los datos salen de bm_fila().datos (estado.swd); las marcas, de marcaDe/setMarca, por clave de la fila abierta.
   El texto que se envia es el de respuestaVuelta(): el mismo que hoy. Salir vuelve a la lista: el swipe es el unico formato
   para decidir, el iframe y el bloque solo aparecen si los datos del swipe no cargan.
   El motor trabaja sobre un mazo de «entradas» {cid, clave, n, it, bot}: una card = un par (botonera, item). Una botonera

/* ----- tipos de card -----
   El agente elige el tipo al armar: sí/no (No va · Editar · Va), una opción (`opciones`: lista) o varias (`varias: true`: casillas).
   Las listas suman «Editar» (desde el 5-nov reemplaza al «Otra cosa…» de la página: elegir o no una + escribir qué cambia); lo que dice «comentá» abre el comentario antes de marcar; la card sale volando con cada marca.
   La fila chica trae Al final, Después (marca interna «después»: la sesión la anota donde guardás tus pendientes y cierra la tanda) y /rot (antes +info): pide que la sesión explique esa card de nuevo con más dibujo y menos texto. */
var MQ_OTRA = {id: 'otra', etiqueta: 'Otra cosa', abierta: true};
function mqLista(it){
  var o = Array.isArray(it && it.opciones) ? it.opciones.filter(function(x){ return x && /^[a-z0-9_-]{1,30}$/.test(String(x.id || '')) && x.etiqueta; }) : [];
  return o.length >= 2 && o.length <= 5 ? o : null;
}
// las opciones de la card, con «Otra cosa» (id otra) al final si ninguna es abierta; null = card de sí/no.
// En la barra no se pinta: Editar sin ninguna marcada vuelve como «eligió otra» con el comentario
function mqOpciones(it){
  var o = mqLista(it); if(!o) return null;
  if(!o.some(mqAbierta)) o = o.concat([MQ_OTRA]);
  return {lista: o, varias: it.varias === true};
}
function mqEtiqueta(it, id){
  var o = (mqOpciones(it) || {lista: []}).lista.filter(function(x){ return String(x.id) === id; })[0];
  return o ? String(o.etiqueta) : id;
}
// una opción pide texto si es abierta o si su etiqueta dice «comentá»: así el comentario no se pierde
function mqAbierta(x){ return !!(x && (x.abierta || /coment/i.test(String(x.etiqueta || '')))); }
function mqPideCom(t){ return /coment/i.test(String(t || '')); }
function mqFrente(sw){ var e = sw && sw.por[primeraActiva(sw)]; return e && swipeVista(sw) === 'card' ? e : null; }
function mqCardOp(sw){ var e = mqFrente(sw); return !!(e && (mqOpciones(e.it) || esRev(e.it))); }   // opciones y revisión: solo se decide con los botones (el swipe horizontal no hace nada)
// marca la card del frente haciéndola volar; o = ids elegidos (op)
function mqMarcar(sw, cid, m, o){
  var e = sw.por[cid]; if(!e) return;
  if(sw.d && primeraActiva(sw) === cid){
    swSalir(m === 'no' ? 'left' : m === 'de' || m === 'co' || m === 'ro' ? 'up' : 'right', function(){ if(o) setMarca(e.clave, e.n, 'o', o); swipeMarcar(sw, cid, m); });
    return;
  }
  if(o) setMarca(e.clave, e.n, 'o', o);
  swipeMarcar(sw, cid, m);
}
/* ----- Editar: `campos` del ítem (lista de {id, etiqueta, valor, tipo: texto|textarea|numero|fecha|opcion, opciones?}, hasta 5) -----
   `textarea` = texto largo en varias líneas (un mail): se abre cargado con el borrador y vuelve entero, con ⏎ por cada salto de línea.
   Los valores que propuso el agente salen cargados en campos. El que el usuario cambia queda marcado, con «Antes: X» y «Volver al original».
   La respuesta vuelve «N. va con cambios · título → acción · campos: id=nuevo (antes viejo); … · comentario: …».
   El comentario libre queda siempre visible debajo de los campos (a veces el campo libre sirve: se deja siempre). */
var MQ_TIPOS = {texto: 1, textarea: 1, numero: 1, fecha: 1, opcion: 1};
var MQ_LAPIZ = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#1C1B1B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14 7l3 3"/></svg>';
function mqCampos(it){
  var out = [];
  (Array.isArray(it && it.campos) ? it.campos : []).forEach(function(c){
    if(!c || typeof c !== 'object' || !/^[a-z0-9_-]{1,30}$/i.test(String(c.id || '')) || !c.etiqueta || !MQ_TIPOS[c.tipo]) return;
    var op = c.tipo === 'opcion' ? (Array.isArray(c.opciones) ? c.opciones.map(String) : []) : null;
    if(op && op.length < 2) return;
    out.push({id: String(c.id), etiqueta: String(c.etiqueta), tipo: c.tipo, valor: c.valor == null ? '' : String(c.valor), opciones: op});
  });
  return out.slice(0, 5);
}
function mqIgual(tipo, a, b){
  a = String(a == null ? '' : a).replace(/\r\n?/g, '\n').trim(); b = String(b == null ? '' : b).replace(/\r\n?/g, '\n').trim();
  if(tipo === 'numero' && a !== '' && b !== '' && isFinite(Number(a)) && isFinite(Number(b))) return Number(a) === Number(b);
  return a === b;
}
// una fecha ISO se muestra como «lun 9 nov»; el resto, tal cual
function mqVer(c, v){
  if(c.tipo === 'textarea'){ v = String(v).replace(/\s+/g, ' ').trim(); return v.length > 90 ? v.slice(0, 90) + '…' : v; }
  if(c.tipo === 'fecha' && /^\d{4}-\d{2}-\d{2}$/.test(v)){
    try{ return new Date(v + 'T12:00:00').toLocaleDateString('es-AR', {weekday: 'short', day: 'numeric', month: 'short'}); }catch(e){}
  }
  return v;
}
// «id=nuevo (antes viejo); …» de los campos que cambiaron, en el orden del ítem. f = {id: nuevo}
function mqCamposTxt(it, f){
  if(!f) return '';
  return mqCampos(it).filter(function(c){ return f[c.id] != null && !mqIgual(c.tipo, f[c.id], c.valor); }).map(function(c){
    if(c.tipo === 'textarea'){   // la respuesta es una línea: cada salto de línea vuelve como ⏎, el texto va entero y el original no se repite
      var nuevo = String(f[c.id]).replace(/\r\n?/g, '\n').trim().split('\n').map(function(l){ return l.replace(/[ \t]+/g, ' ').trim(); }).join('⏎');
      return c.id + '=' + nuevo + ' (antes: borrador de ' + c.valor.length + ' caracteres)';
    }
    return c.id + '=' + String(f[c.id]).replace(/\s+/g, ' ').trim() + ' (antes ' + c.valor.replace(/\s+/g, ' ').trim() + ')';
  }).join('; ');
}
// cuántos campos cambiaron (los de f que difieren del original)
function mqCamposN(it, f){
  if(!f) return 0;
  return mqCampos(it).filter(function(c){ return f[c.id] != null && !mqIgual(c.tipo, f[c.id], c.valor); }).length;
}
// «1 cambio pendiente»: cambios escritos en Editar que todavía no se confirmaron. Un Va (botón, swipe o flecha) los manda; No va no.
function swPendHTML(e){
  if(!e || !mqCampos(e.it).length) return '';
  var st = marcaDe(e.clave, e.n), n = st.m === 'vc' || st.m === 'no' ? 0 : mqCamposN(e.it, st.f);
  return n ? '<p class="sw-pend" role="status">' + esc(pl(n, 'cambio pendiente', 'cambios pendientes')) + '<span>Va los manda con el cambio</span></p>' : '';
}
function mqCampoHTML(c, val, i){
  var id = 'sw-f' + i, cam = !mqIgual(c.tipo, val, c.valor), inp;
  if(c.tipo === 'opcion') inp = '<select id="' + id + '" class="sw-in" data-f="' + esc(c.id) + '">' + c.opciones.map(function(o){
    return '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
  else if(c.tipo === 'textarea') inp = '<textarea id="' + id + '" class="sw-in sw-ta" data-f="' + esc(c.id) + '" rows="' + Math.min(14, Math.max(6, String(val).split('\n').length + 1)) + '" autocomplete="off">' + esc(val) + '</textarea>';
  else inp = '<input id="' + id + '" class="sw-in" data-f="' + esc(c.id) + '" type="' + (c.tipo === 'numero' ? 'number' : c.tipo === 'fecha' ? 'date' : 'text') + '"' +
    (c.tipo === 'numero' ? ' inputmode="decimal" step="any"' : '') + ' value="' + esc(val) + '" autocomplete="off">';
  return '<div class="sw-f' + (cam ? ' cambio' : '') + '" data-fid="' + esc(c.id) + '" data-tipo="' + esc(c.tipo) + '" data-orig="' + esc(c.valor) + '">' +
    '<label for="' + id + '">' + esc(c.etiqueta) + '<span class="sw-tag">Cambiado</span></label>' + inp +
    '<div class="sw-fnota"><span>Antes: <s>' + esc(mqVer(c, c.valor)) + '</s></span><button type="button" class="sw-fre" data-a="ed-volver">Volver al original</button></div></div>';
}
// lo que cambió en la hoja abierta: {id: valor nuevo}
function mqEdLeer(root){
  var f = {};
  Array.prototype.forEach.call(root.querySelectorAll('.sw-f[data-fid]'), function(w){
    var inp = w.querySelector('[data-f]');
    if(inp && !mqIgual(w.getAttribute('data-tipo'), inp.value, w.getAttribute('data-orig'))) f[w.getAttribute('data-fid')] = inp.value;

// marca los campos que cambiaron y reescribe el resumen y el botón de abajo (sin repintar: el campo no pierde el foco)
function mqEdSync(root){

  Array.prototype.forEach.call(root.querySelectorAll('.sw-f[data-fid]'), function(w){
    var inp = w.querySelector('[data-f]'), cam = !!inp && !mqIgual(w.getAttribute('data-tipo'), inp.value, w.getAttribute('data-orig'));
    w.classList.toggle('cambio', cam); if(cam) n++;
  });
  var tc = root.querySelector('textarea[data-com]'), hay = n > 0 || !!(tc && tc.value.trim());

  if(r) r.textContent = n ? pl(n, 'cambio', 'cambios') + ' · lo demás queda igual' : (hay ? 'Sin cambios en los campos · va con tu comentario' : 'Sin cambios · queda como lo propuso el agente');
  if(bt) bt.textContent = hay ? 'Va con estos cambios' : 'Va como está';

// Editar también en opciones y casillas, como en las de sí/no
var MQ_ED_OP = '<button type="button" class="sw-op ed" data-a="editar">' + MQ_LAPIZ + '<span>Editar …</span></button>';
// la barra de la card: opciones, casillas, o No va · Editar · Va
function mqBarraHTML(it, a){
  if(esRev(it)) return revBarraHTML();   // la card de revisión: un solo botón, Revisado, y Comentar
  var op = mqOpciones(it), rec = String(it.reco || '').trim();
  function rt(id){ return id === rec ? '<span class="rt">El agente recomienda esta</span>' : ''; }

    return '<div class="sw-ops">' + op.lista.filter(function(x){ return x !== MQ_OTRA; }).map(function(x){

    }).join('') + MQ_ED_OP + '</div>';

  if(op){

function reducido(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function pl(n, uno, otro){ return n + ' ' + (n === 1 ? uno : otro); }

/* ----- datos: bm_fila de la fila abierta, una vez por clave+estado+updated_at ----- */
function datosDeFila(d){
  var dat = d && d.datos;
  if(typeof dat === 'string'){ try{ dat = JSON.parse(dat); }catch(e){ dat = null; } }
  return dat && typeof dat === 'object' ? dat : null;
}
// los temas son las secciones, en orden. Sin secciones (o con una) hay un solo mazo «Todo»; lo que no matchea va a «Otros»
function armarTemas(items, secs){
  secs = Array.isArray(secs) ? secs.filter(function(s){ return s && typeof s === 'object' && s.id != null && s.id !== ''; }) : [];
  if(secs.length < 2) return [{id: 'todo', titulo: 'Todo', items: items.slice()}];
  var ids = {}, temas = [];
  secs.forEach(function(s){
    var id = String(s.id);
    if(ids[id]) return;
    ids[id] = true;
    temas.push({id: id, titulo: String(s.titulo || s.id), nota: s.nota ? String(s.nota) : '', items: items.filter(function(it){ return String(it.seccion) === id; })});
  });
  temas = temas.filter(function(t){ return t.items.length; });
  var otros = items.filter(function(it){ return !ids[String(it.seccion)]; });
  if(otros.length) temas.push({id: '__otros', titulo: 'Otros', items: otros});
  return temas;
}
function swipeCargar(t, forzar){
  var ab = t && t.abierta; if(!ab) return;
  var token = estado.token; if(!token) return;
  var k = llaveFila(ab), s = estado.swd;
  if(!s || s.clave !== ab.clave){ s = estado.swd = {clave: ab.clave, k: null, d: null, items: [], temas: [], sig: '', enVuelo: null, listo: false, error: false, cambio: false}; }
  if(forzar) s.k = null;
  if(s.k === k || s.enVuelo === k) return;
  s.enVuelo = k;
  sb.rpc('bm_fila', {p_token: token, p_clave: ab.clave}).then(function(r){
    if(token !== estado.token) return;
    if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
    if(estado.swd !== s) return; // cambio la fila abierta mientras tanto
    if(s.enVuelo === k) s.enVuelo = null;
    var d = Array.isArray(r.data) ? r.data[0] : r.data;
    if(r.error || !d){ console.warn('swipe', r.error); s.error = true; s.listo = true; s.cambio = false; }
    else {
      var items = itemsDeVuelta(d), dat = datosDeFila(d), secs = dat && dat.secciones;
      var sig = JSON.stringify([items, secs]);
      s.cambio = !!s.sig && sig !== s.sig;
      if(sig !== s.sig){ s.sig = sig; s.items = items; s.temas = armarTemas(items, secs); }
      s.k = k; s.d = d; s.error = false; s.listo = true;
    }
    swipeLlego(s);
  }, function(err){
    if(s.enVuelo === k) s.enVuelo = null;
    if(estado.swd === s){ console.warn('swipe', err); s.error = true; s.listo = true; s.cambio = false; swipeLlego(s); }
  });
}
function swipeListo(t){
  var ab = t && t.abierta, s = estado.swd;
  return !!ab && !!s && s.clave === ab.clave && s.listo && !s.error && !!s.d && s.items.length > 0;
}
function swipeActivo(t){ return estado.swipePref && swipeListo(t); }
// con el swipe prendido, mientras no llegan los datos no se arma ni el iframe ni el bloque (evita el parpadeo)
function swipeEspera(t){
  var ab = t && t.abierta, s = estado.swd;
  return estado.swipePref && !!ab && !(s && s.clave === ab.clave && s.listo);

function swipeLlego(s){
  var t = tandaSel(); if(!t || !t.abierta || t.abierta.clave !== s.clave) return;
  var sw = estado.sw;
  if(sw && sw.el && sw.clave === s.clave && s.cambio){
    sw.aviso = sw.aviso || 'La botonera cambió. Armé el mazo de nuevo con tus marcas.';
    if(swipeOcupado(sw)) sw.rearmar = true; else swipeRearmar();
  }
  pintarPanel(false);
}

/* ----- animaciones (por tiempo; el reloj cae a setTimeout si el navegador pausa requestAnimationFrame) ----- */
function sigFrame(fn){

function tween(dur, f, fin){

    f(p);
    if(p >= 1){ if(fin) fin(); return; }
    sigFrame(paso);
  }

}
// resorte de vuelta (stiffness 420, damping 34); sin resorte con reduced-motion
function resorte(x0, y0, vx, vy, fin){
  var x = x0, y = y0, t0 = performance.now(), last = t0, cancelado = false;

    var pasos = Math.max(1, Math.ceil(dt / 0.004)), h = dt / pasos;
    for(var i = 0; i < pasos; i++){
      vx += (-420 * x - 34 * vx) * h; x += vx * h;

    }
    var fuera = now - t0 > 1500;
    if(fuera || (Math.abs(x) < 0.4 && Math.abs(y) < 0.4 && Math.abs(vx) < 8 && Math.abs(vy) < 8)){ swPos(0, 0); if(fin) fin(); return; }

function swEntrar(sw){

    var e = 1 - Math.pow(1 - p, 3);
    card.style.opacity = String(e);
    if(!red) swPos(0, 16 * (1 - e));
  }, function(){ card.style.opacity = ''; swPos(0, 0); sw.tw = null; });
  if(sw.tw) sw.tw.ent = true; // swDown lo distingue del resorte de vuelta
}
// posicion de la card + carteles + borde
function swPos(x, y){
  var sw = estado.sw, d = sw && sw.d; if(!d || !d.card) return;
  sw.px = x; sw.py = y;
  var rot = Math.max(-12, Math.min(12, x / 200 * 12));
  d.card.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) rotate(' + rot + 'deg)';
  var arriba = y < -28 && Math.abs(y) >= Math.abs(x) * 0.88;
  var go = (x > 0 && !arriba) ? Math.min(1, Math.sqrt(x / SW_RAMPA)) : 0;
  var no = (x < 0 && !arriba) ? Math.min(1, Math.sqrt(-x / SW_RAMPA)) : 0;
  var up = (y < 0 && !(Math.abs(x) > 40 && Math.abs(y) < Math.abs(x) * 0.92)) ? Math.min(1, Math.sqrt(-y / SW_RAMPA)) : 0;
  d.hgo.style.opacity = String(go); d.hno.style.opacity = String(no); d.hup.style.opacity = String(up);
  var max = Math.max(go, no, up), st = d.card.style;

  if(go >= no && go >= up){ st.borderColor = '#8ECAC8'; st.boxShadow = '0 0 0 1px rgba(142,202,200,.45)'; }
  else if(no >= up){ st.borderColor = '#262626'; st.boxShadow = '0 0 0 1px rgba(0,0,0,.18)'; }
  else { st.borderColor = 'rgb(107,114,128)'; st.boxShadow = '0 0 0 1px rgba(107,114,128,.25)'; }

// sale la card (gesto, boton o tecla) y despues se aplica la accion
function swSalir(dir, fn){

function swVel(pts){

  if(e.target.closest('button.sw-catchip,summary,a')) return;   // el chip, el fyi plegable y los links reciben su click: no capturan el puntero ni arrastran

/* ---------- snooze de una botonera ----------
   En la card negra de contexto, izquierda (gesto, flecha ← o el boton Snooze) abre «¿Cuando vuelve?». Elegir llama a bm_snoozear y,
   recien con el OK, la botonera sale del mazo. En la base sigue `abierta` (con snooze_hasta): sus marcas se conservan (limpiarMarcas no la toca)
   y la pagina nunca la envia mientras duerme. Todas las horas se calculan y se muestran en la zona horaria del dispositivo. */
var SNZ_DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
var SNZ_TOAST_MS = 5000;
// fecha y hora de un instante en la zona horaria del dispositivo: {y, m, d, h, mi, s, dow}
function snzPartes(t){
  var x = new Date(t);
  return {y: x.getFullYear(), m: x.getMonth() + 1, d: x.getDate(), h: x.getHours(), mi: x.getMinutes(), s: x.getSeconds(), dow: x.getDay()};
}
// el instante de «y-m-d h:mi» en hora local (d puede salirse del mes: Date lo acomoda; el horario de verano lo resuelve el navegador)
function snzInstante(y, m, d, h, mi){
  return new Date(y, m - 1, d, h, mi, 0, 0).getTime();
}
function snzFecha(t){ var p = snzPartes(t); return p.y + '-' + ('0' + p.m).slice(-2) + '-' + ('0' + p.d).slice(-2); }
// UNA sola funcion de formato para el sheet, el toast y el home: «vie 18:00»; a mas de 6 dias suma el numero de dia: «lun 16 8:00»
function snzCuando(t, ref){
  var p = snzPartes(t), h = snzPartes(ref == null ? Date.now() : ref);
  var dias = Math.round((Date.UTC(p.y, p.m - 1, p.d) - Date.UTC(h.y, h.m - 1, h.d)) / 86400000);
  return SNZ_DIAS[p.dow] + (dias > 6 ? ' ' + p.d : '') + ' ' + p.h + ':' + ('0' + p.mi).slice(-2);
}
// las 4 opciones fijas, segun la hora local de t
function snzOpciones(t){
  var p = snzPartes(t), out = [];
  function en(dias, h){ return snzInstante(p.y, p.m, p.d + dias, h, 0); }
  function op(id, rot, hasta){ out.push({id: id, rot: rot, hasta: hasta, cuando: snzCuando(hasta, t), fecha: snzFecha(hasta)}); }
  if(p.h < 17) op('hoy', 'Hoy más tarde', en(0, 18));
  op('manana', 'Mañana', en(1, 8));
  if(p.dow !== 0 && p.dow !== 6) op('finde', 'El finde', en(6 - p.dow, 9));
  if(p.dow !== 0) op('lunes', 'Próximo lunes', en(((1 - p.dow + 7) % 7) || 7, 8));   // el lunes de hoy ya paso: va el de la semana que viene
  return out;
}
function snzFila(clave){ return estado.filas.filter(function(f){ return f.clave === clave; })[0] || null; }
// lo que la pagina sabe y la proxima bm_lista todavia no refleja (snooze/despertar hechos aca): {hasta, ts}. ts = el numero de la ultima bm_lista
// pedida cuando la base contesto el OK. Una respuesta de bm_lista pedida ANTES (seq <= ts) es vieja y se le reaplica; una pedida despues ya lo refleja y lo borra
function snzFijarLocal(clave, hasta){
  var L = estado.snzLocal || (estado.snzLocal = {});
  L[clave] = {hasta: hasta, ts: estado.listaSeq || 0};
}
function snzAplicarLocal(seq){
  var L = estado.snzLocal; if(!L) return;
  Object.keys(L).forEach(function(clave){

// saca la botonera del mazo de varias (cola, conteos, resumen y envio) y guarda lo sacado para el Deshacer
function snzQuitar(sw, clave){

  sw.bots = (sw.bots || []).filter(function(b){ return b.clave !== clave; });
  sw.todas = sw.todas.filter(function(e){ if(!cids[e.cid]) return true; st.todas.push(e); return false; });
  sw.temas.forEach(function(t, ti){
    t.items = t.items.filter(function(e, i){ if(!cids[e.cid]) return true; st.mazo.push({ti: ti, i: i, e: e}); return false; });
  });
  sw.cola = sw.cola.map(function(q, ti){ return q.filter(function(cid){ if(!cids[cid]) return true; st.cola.push({ti: ti, cid: cid}); return false; }); });

function ahMandar(){

  var er = sw.sheetEl.querySelector('.sw-snz-err'); if(er) er.textContent = '';
  sin.forEach(function(it){ setMarca(clave, it.n, 'm', 'de'); });
  function sacar(){ sin.forEach(function(it){ if(marcaDe(clave, it.n).m === 'de') setMarca(clave, it.n, 'm', ''); }); }
  function falla(motivo){   // se sacan las marcas que puso el boton; el sheet queda abierto con el motivo

/* ---------- home del swipe ----------
