   La categoria sale de datos.categoria ({id, nombre, color, emoji|icono, orden, privada}); sin ella la botonera cuenta en «Otras».
   El orden sale de datos.categoria.orden (numerico, ascendente): sin orden va despues de las numeradas y «Otras» siempre al final. */
var CAT_OTRAS = {id: 'otras', nombre: 'Otras', color: '#E0DCD2',
  icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>'};

// numeradas por orden ascendente; sin orden despues de ellas; «otras» al final
function catPos(cat){

}
function catDe(dat){
  var c = dat && dat.categoria;
  if(!c || typeof c !== 'object' || !/^[a-z0-9_-]{1,30}$/i.test(String(c.id || ''))) return CAT_OTRAS;
  return {id: String(c.id), nombre: String(c.nombre || c.id),
    color: /^#[0-9a-fA-F]{3,8}$/.test(String(c.color || '')) ? String(c.color) : CAT_OTRAS.color,
    emoji: typeof c.emoji === 'string' ? c.emoji.slice(0, 16) : '',
    icono: typeof c.icono === 'string' && c.icono ? c.icono : (c.emoji ? '' : CAT_OTRAS.icono),
    orden: ((typeof c.orden === 'number' || (typeof c.orden === 'string' && c.orden.trim() !== '')) && isFinite(Number(c.orden))) ? Number(c.orden) : null,
    privada: c.privada === true};
}
// el icono de la categoria va como <img> con data: URI (nunca como html crudo): el svg no ejecuta nada
function catIcono(cat, cls){

function hoyISO(){

function homeCargar(){

function homeCalc(){

  Object.keys(estado.hd).forEach(function(c){
    var r = estado.hd[c];
    if(!r.listo) cargando = true;

  });

    var pend = 0, hoy = 0, marc = 0, prim = r.tanda && (r.tanda.baseFila || r.tanda.vueltas[0]);
    r.items.forEach(function(it){ if(marcaDe(r.clave, it.n).m) marc++; else { pend++; if(venceYa(it)) hoy++; } });
    r.pend = pend; r.hoy = hoy; r.marc = marc;
    r.titulo = (r.tanda && r.tanda.entrada.titulo) || r.clave;
    r.creada = prim ? ms(prim.created_at) : 0;
    r.llega = Math.max(r.creada, ms(llegadaDe(r.tanda && r.tanda.abierta)));   // una que desperto del snooze se ordena por su llegada
    var c = cats[r.cat.id] || (cats[r.cat.id] = {id: r.cat.id, cat: r.cat, bots: [], pend: 0, hoy: 0, marc: 0, tot: 0});
    c.bots.push(r); c.pend += pend; c.hoy += hoy; c.marc += marc; c.tot += r.items.length;
    if(pend){ tot.pend += pend; tot.hoy += hoy; tot.bots++; }

// tocar una categoria: con 2+ botoneras pendientes se eligen en tarjetitas negras; con una sola, derecho al mazo

function homePintar(){

/* sin boton «Enviar» en el home principal, las botoneras con todas sus cards marcadas (listas) se mandan solas al cargar el home.
   Una vez por carga de pagina y por clave: las claves ya intentadas viven en una variable del modulo (no en estado), asi un poll no repite
   y un envio que fallo no se reintenta hasta la proxima carga. El resultado sale en home-res. Dentro de una categoria no pasa nada. */
var homeAuto = {};
function homeAutoEnviar(){
  if(estado.sw || estado.homeEnviando || !estado.token || !estado.listaCargada) return;
  var H = homeCalc(); if(H.cargando) return;
  if(H.pend && homeCatAbierta(H)) return;
  var nuevas = H.listas.filter(function(r){ return !homeAuto[r.clave]; });
  if(!nuevas.length) return;
  nuevas.forEach(function(r){ homeAuto[r.clave] = true; });
  homeEnviar(nuevas.map(function(r){ return r.clave; }));
}
// la tanda del «?c=»: se abre sola en el mazo cuando su JSON ya llegó; sin cards pendientes (o ya cerrada) queda el home
function homeAbrirPedida(){
  var b = estado.abrirClave; if(!b || estado.sw || !estado.listaCargada) return;
  var t = tandas().mapa[b];
  var r = t && t.abierta ? estado.hd[t.abierta.clave] : null;
  if(r && !r.listo) return; // todavia cargando
  estado.abrirClave = null;
  if(r && !r.error) homeSwipear(null, r.clave);

function alClickHome(e){
  var tg = e.target; if(!tg || !tg.closest) return;

  if(a === 'enviar') homeEnviar();   // el «Enviar» de una categoria: todas las listas, como siempre
  else if(a === 'avisos') avisosActivar();

  else if(a === 'snz-abrir'){ estado.snzAbierta = estado.snzAbierta === false; homePintar(); }
  else if(a === 'visto') errorVisto(b.getAttribute('data-id'));
  else if(a === 'cat') homeElegirCat(b.getAttribute('data-cat'));
  else if(a === 'volver'){ estado.homeCat = null; homePintar(); }
  else if(a === 'tanda') homeSwipear(null, b.getAttribute('data-clave'));

// manda las botoneras listas (todas sus cards marcadas): una por una, con su propio bm_decidir_pin; una que falle no frena a las otras
function homeEnviar(claves){   // claves (opcional): solo esas listas; sin ellas, todas
  if(estado.homeEnviando || estado.sw) return;
  var token = estado.token; if(!token) return;
  var cola = homeCalc().listas.filter(function(r){ return !Array.isArray(claves) || claves.indexOf(r.clave) >= 0; });
  if(!cola.length) return;
  estado.homeEnviando = true; estado.homeEnvs = {};
  var i = 0, oks = 0;
  function fin(){ estado.homeEnviando = false; homePintar(); var p = cargarLista(); if(oks) festejoTras(p); }
  function sig(){
    if(i >= cola.length){ fin(); return; }
    var r = cola[i++], clave = r.clave;
    if(estado.bloqueadas[clave]){ sig(); return; }
    estado.bloqueadas[clave] = true;
    var env = estado.homeEnvs[clave] = {st: 'enviando', msg: '', titulo: r.titulo};
    homePintar();
    sb.rpc('bm_decidir_pin', {p_token: token, p_clave: clave, p_respuesta: textoDe(clave, r.items), p_version: (r.d && r.d.updated_at) || null})
      .then(function(res){
        estado.bloqueadas[clave] = false;
        if(token !== estado.token) return;
        if(res.error && tokenMalo(res.error)){ sesionVencida(); return; }
        if(res.error){ env.st = 'error'; env.msg = res.error.message || 'No se pudo enviar'; }
        else if(res.data === 'decidida'){ env.st = 'ok'; oks++; }
        else if(res.data === 'cambio') env.st = 'cambio';
        else { env.st = 'ya'; env.msg = 'ya estaba ' + res.data; }
        homePintar(); sig();
      }, function(err){
        estado.bloqueadas[clave] = false;
        if(token !== estado.token) return;
        env.st = 'error'; env.msg = (err && err.message) || 'No se pudo enviar';
        homePintar(); sig();
      });
  }
  sig();
}

/* ----- Seguimiento: lo ya mandado y todavía sin cerrar, al final del home -----
   Grupos apilados: Trabadas · En curso · En vuelo · Archivadas, solo los que tienen algo; sin nada en ninguno, la fila no existe.
   Los datos salen de bm_lista (las tandas) y de bm_seguimiento (En vuelo). Si bm_seguimiento falla o todavía no existe en la base, la fila anda igual sin En vuelo.
   Una tanda = la base y sus vueltas -rN (armarTandas). Trabada = decidida o recibida con más de 24 h sin cambio (las bot-* no). */
var SEG_TRABADA_MS = 24 * 3600e3;   // del botonera-v2
var SEG_APLICADA_MS = 24 * 3600e3;  // pasado ese tiempo una aplicada sale de En curso y va a Archivadas
var SEG_ARCHIVO_MS = 30 * 24 * 3600e3;
var SEG_MAX = 5;                    // más de 5 en un grupo: «Ver N más»
var SEG_ICO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>';
var SEG_TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function segEstado(){ return estado.seg || (estado.seg = {d: null, busy: false, ab: {}, arch: false, mas: {}, ocultas: {}, pend: null}); }
function segCargar(){
  var token = estado.token; if(!token) return;
  var S = segEstado(); if(S.busy) return;
  S.busy = true;
  sb.rpc('bm_seguimiento', {p_token: token}).then(function(r){
    S.busy = false;
    if(token !== estado.token) return;
    if(r.error){ if(tokenMalo(r.error)) sesionVencida(); return; }   // sin la RPC (migración sin aplicar) o caída: la fila sigue con lo de bm_lista
    var d = r.data;
    if(!d || typeof d !== 'object') return;
    S.d = {vuelo: Array.isArray(d.vuelo) ? d.vuelo : []};   // bm_seguimiento trae además pedidos/escucha_at/activos: esta versión no los usa
    homePintar();
  }, function(){ S.busy = false; });
}
// «40 min», «30 h», «3 d»: cuánto hace desde t
function segDur(t){
  var m = Math.max(1, Math.floor((Date.now() - t) / 60000));
  if(m < 60) return m + ' min';
  var h = Math.floor(m / 60);
  return h < 48 ? h + ' h' : Math.floor(h / 24) + ' d';
}
// la hora de una fila de En vuelo, como en la
function segVueloCuando(t){
  var m = (Date.now() - ms(t)) / 60000;
  if(m < 1) return 'ahora';
  if(m < 60) return 'hace ' + Math.floor(m) + ' min';
  var h = m / 60;
  if(h < 24) return 'hace ' + Math.floor(h) + ' h';
  return h < 48 ? 'ayer' : 'hace ' + Math.floor(h / 24) + ' d';
}
function segFecha(t){ var p = snzPartes(t); return p.d + '-' + SW_MESES[p.m - 1]; }
// las entradas de cada grupo, a partir de las tandas de bm_lista y de bm_seguimiento
function segGrupos(){
  var S = segEstado(), T = tandas(), ahora = Date.now(), G = {trabadas: [], encurso: [], vuelo: [], hechas: [], archivadas: []};
  function pendiente(f){ return f.estado === 'decidida' || f.estado === 'recibida' || f.estado === 'esperando'; }
  // archivada hace un rato: se esconde hasta que la lista traiga archivadas sus filas (o pasen 45 s sin que llegue)
  function oculta(kk, t){
    var oc = S.ocultas[kk]; if(!oc) return false;
    if(oc.estado === 'hecho' && (ahora - oc.t > 45000 || oc.claves.every(function(c){ return t.vueltas.some(function(f){ return f.clave === c && f.estado === 'archivada'; }); }))){ delete S.ocultas[kk]; return false; }
    return true;
  }
  Object.keys(T.mapa).forEach(function(b){
    var t = T.mapa[b], e = t.entrada, est = e.estado;
    var base = {titulo: e.titulo || b, ses: e.sesion_titulo || '', sid: e.session_id || '', todas: t.vueltas.map(function(f){ return f.clave; }), trabada: false};
    function nuevo(kk, estX, extra){ var x = {clave: kk, est: estX, claves: []}; Object.keys(base).forEach(function(k){ x[k] = base[k]; }); Object.keys(extra || {}).forEach(function(k){ x[k] = extra[k]; }); return x; }
    var dTrab = t.trabajando ? ms(e.trab_desde) : 0, viejaTrab = !!dTrab && !/^bot-/.test(b) && ahora - dTrab > SEG_TRABADA_MS;
    // caso raro: una vuelta abierta o esperando y otra anterior trabada: la trabada igual va a Trabadas (con su propia clave, para archivarla sola)
    if((est === 'abierta' || est === 'esperando') && viejaTrab && !oculta(b + '#trab', t)){
      G.trabadas.push(nuevo(b + '#trab', t.trabajando.estado, {desde: dTrab, trabada: true,
        claves: t.vueltas.filter(function(f){ return f.estado === 'decidida' || f.estado === 'recibida'; }).map(function(f){ return f.clave; })}));
    }
    if(oculta(b, t)) return;
    if(est !== 'decidida' && est !== 'recibida' && est !== 'esperando' && est !== 'aplicada' && est !== 'archivada') return;   // abierta (mazo o Snoozeadas) y respondida_en_chat no entran
    var x = nuevo(b, est, {claves: t.vueltas.filter(pendiente).map(function(f){ return f.clave; })});
    if(est === 'decidida' || est === 'recibida'){
      x.desde = ms(e.trab_desde);
      x.trabada = viejaTrab;   // las bot-* están en pausa a propósito: no son trabadas
      (x.trabada ? G.trabadas : G.encurso).push(x);
    } else if(est === 'esperando'){
      x.desde = ms(e.esperando_at) || ms(e.updated_at); x.motivo = e.espera_motivo || ''; x.sid = e.esperando_session || x.sid;
      G.encurso.push(x);
    } else {
      x.cuando = ms(e.applied_at) || ms(e.updated_at) || ms(e.created_at);
      if(est === 'aplicada'){
        x.resumen = String((t.ultima && t.ultima.resumen_aplicado) || '').split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean)[0] || '';
        if(ahora - x.cuando <= SEG_APLICADA_MS) G.hechas.push(x); else if(ahora - x.cuando <= SEG_ARCHIVO_MS) G.archivadas.push(x);   // una aplicada de las últimas 24 h es «Hecha hoy»
      } else {
        x.cuando = ms(e.updated_at) || ms(e.created_at);
        if(ahora - x.cuando <= SEG_ARCHIVO_MS) G.archivadas.push(x);
      }
    }
  });
  G.trabadas.sort(function(a, b){ return a.desde - b.desde; });   // la que hace más que está trabada, primero
  function prio(x){ return x.est === 'esperando' ? 0 : x.est === 'aplicada' ? 2 : 1; }
  G.encurso.sort(function(a, b){ return (prio(a) - prio(b)) || ((b.desde || b.cuando) - (a.desde || a.cuando)); });
  G.hechas.sort(function(a, b){ return b.cuando - a.cuando; });
  G.archivadas.sort(function(a, b){ return b.cuando - a.cuando; });   // la más nueva arriba
  G.vuelo = S.d ? S.d.vuelo.filter(function(v){ return v && v.estado !== 'cerrada'; }).sort(function(a, b){ return ms(b.updated_at) - ms(a.updated_at); }) : [];
  return G;
}
function segBuscar(clave){
  var G = segGrupos(), r = null;
  ['trabadas', 'encurso', 'hechas', 'archivadas'].forEach(function(k){ G[k].forEach(function(x){ if(x.clave === clave) r = x; }); });
  return r;
}
/* ----- Registro claro -----
   Las trabadas son cards dentro de «Te esperan a vos» (hasta 3, después «Ver N más»). Debajo, dos listas planas de una línea:
   «Trabajando ahora» (en curso + en vuelo) y «Hechas hoy». Tocar una fila la abre: ahí están el detalle, los botones y el link a la conversación (una sola vez).
   Las archivadas salen de la lista: un link «Archivo · N ›» al pie las muestra o las oculta. */
// una trabada como card de «Te esperan a vos»: título, cuánto hace que se frenó, de dónde viene y «Archivar»
function segTrabHTML(x){
  var cl = esc(x.clave);
  return '<div class="hac" data-clave="' + cl + '"><b>' + esc(x.titulo) + '</b><span class="hac-frena">' + esc('Se frenó · sin novedad hace ' + segDur(x.desde)) + '</span>' +
    (x.ses ? '<span class="hac-de">' + esc(x.ses) + '</span>' : '') +
    '<div class="bts"><button type="button" data-home="seg-archivar" data-clave="' + cl + '" aria-label="' + esc('Archivar: ' + x.titulo) + '">Archivar</button></div></div>';
}
// la pastilla de una línea: una o dos palabras
function segFilaEstado(x){
  if(x.vuelo) return {cls: '', txt: 'Trabajando'};
  if(x.est === 'decidida') return {cls: '', txt: 'Mandada'};
  if(x.est === 'recibida') return {cls: '', txt: 'Trabajando'};
  if(x.est === 'esperando') return {cls: 'w', txt: 'Te espera'};
  if(x.est === 'aplicada') return {cls: 'ok', txt: 'Hecha'};
  return {cls: 'mudo', txt: 'Archivada'};
}
// lo que se ve recién al abrir la fila: el detalle (en castellano), el resumen o la nota
function segFilaDetalle(x){
  var l = [];
  if(x.vuelo){
    var q = [x.vuelo.que_hace, x.vuelo.proximo ? 'próximo: ' + x.vuelo.proximo : ''].filter(Boolean).join(' · ');
    if(q) l.push(q);
    l.push('Última noticia: ' + segVueloCuando(x.vuelo.updated_at));
  } else {
    if(x.est === 'decidida') l.push('Mandada · esperando que la conversación la tome');
    else if(x.est === 'recibida') l.push('El agente está trabajando · hace ' + segDur(x.desde));
    else if(x.est === 'esperando'){ l.push('Te espera en la conversación'); if(x.motivo) l.push(x.motivo); }
    else if(x.est === 'aplicada'){ if(x.enArchivo && x.cuando) l.push('Aplicada · ' + segFecha(x.cuando)); if(x.resumen) l.push(x.resumen); }
    else l.push('Archivada · ' + segFecha(x.cuando));
    if(x.ses && x.est !== 'aplicada' && x.est !== 'archivada') l.push(x.ses);
  }
  return l.map(function(t){ return '<p class="res">' + esc(t) + '</p>'; }).join('');
}
// una fila fina de una línea; abierta, suma el detalle, el link (una sola vez) y los botones de esa entrada
function segFilaHTML(x){
  var S = segEstado(), k = x.clave, ab = !!S.ab[k], est = segFilaEstado(x);

// una lista plana: título de sección + filas (hasta SEG_MAX, después «Ver N más»); vacía, no se dibuja
function segSeccion(k, nom, lista){

function segArchivar(clave){
  var S = segEstado(), x = segBuscar(clave);
  if(!x || !x.claves.length || S.ocultas[clave]) return;
  segSoltar();   // otro archivado todavía esperando sus 5 s: se confirma ya (el aviso es uno solo)
  S.ocultas[clave] = {estado: 'pend', titulo: x.titulo, claves: x.claves.slice(), t: Date.now()};
  S.pend = {clave: clave, timer: setTimeout(function(){ segConfirmar(clave); }, SNZ_TOAST_MS)};
  homePintar();

    var bt = document.createElement('button'); bt.type = 'button'; bt.setAttribute('data-seg', 'deshacer'); bt.textContent = 'Deshacer';

// la misma llamada que sb.rpc pero con keepalive: sigue viva aunque la pestaña se cierre o se recargue (supabase-js no deja pasarlo por llamada)
function segRpcKeepalive(nombre, args){
  return fetch(SUPABASE_URL + '/rest/v1/rpc/' + nombre, {method: 'POST', keepalive: true,
    headers: {'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY}, body: JSON.stringify(args)})
    .then(function(res){ return res.text().then(function(t){
      var d = null; try{ d = t ? JSON.parse(t) : null; }catch(e){}
      return res.ok ? {data: d, error: null} : {data: null, error: {message: (d && d.message) || t || ('HTTP ' + res.status)}};
    }); });
}
// cerrar, recargar o mandar a segundo plano la pestaña dentro de los 5 s: el archivado pendiente se confirma igual, ya (sin Deshacer)

function segConfirmar(clave, urgente){
  var S = segEstado(), oc = S.ocultas[clave], token = estado.token;
  if(S.pend && S.pend.clave === clave){ clearTimeout(S.pend.timer); S.pend = null; }
  if(!oc || oc.estado !== 'pend' || !token) return;
  function falla(){
    delete S.ocultas[clave];
    if(token !== estado.token) return;
    snzToastMostrar(null, null, null, 'No se pudo archivar');
    homePintar();
  }
  Promise.all(oc.claves.map(function(c){ var a = {p_token: token, p_clave: c}; return urgente && typeof fetch === 'function' ? segRpcKeepalive('bm_archivar_pin', a) : sb.rpc('bm_archivar_pin', a); })).then(function(rs){
    if(token !== estado.token) return;
    var malo = rs.filter(function(r){ return r.error; })[0];
    if(malo && tokenMalo(malo.error)){ sesionVencida(); return; }
    if(malo){ falla(); return; }
    if(rs.some(function(r){ return !r.data || r.data.cambiado === false; })){ delete S.ocultas[clave]; homePintar(); cargarLista(); return; }   // otro dispositivo la movió: manda la base
    oc.estado = 'hecho'; oc.t = Date.now();
    var ahora = new Date().toISOString();
    estado.filas = estado.filas.map(function(f){   // aparece ya en Archivadas; la próxima bm_lista lo confirma
      if(oc.claves.indexOf(f.clave) < 0) return f;
      var g = {}; Object.keys(f).forEach(function(kk){ g[kk] = f[kk]; });
      g.estado = 'archivada'; g.updated_at = ahora; g.espera_motivo = null; g.resumen_aplicado = 'Archivada desde Sesiones';
      return g;
    });
    homePintar();
  }, falla);
}

/* ----- festejo: confeti al enviar, confeti grande al quedar en cero, frase estoica en cero ----- */
// el envío no festeja en el momento del OK: espera a que la lista vuelva y el home cuente lo que quedó.
// Si quedó en cero va solo el grande (nunca los dos encimados), y si el mazo sigue abierto espera a que se vea el home.
// Abrir la app ya en cero no festeja: el festejo nace de un envío de esta visita.
var CONFETI_SRC = '/vendor/confetti.min.js';   // servido desde el mismo sitio (web/vendor/LEEME.md)
var CONFETI_COLORES = ['#8ECAC8', '#F5F0E8', '#FFD166', '#EF476F', '#FFFFFF'];
var confetiLib = null;
function confetiCargar(){
  if(confetiLib) return confetiLib;
  confetiLib = new Promise(function(ok, mal){
    if(window.confetti){ ok(window.confetti); return; }
    var s = document.createElement('script');
    s.src = CONFETI_SRC; s.async = true;
    s.onload = function(){ if(window.confetti) ok(window.confetti); else { confetiLib = null; mal(); } };
    s.onerror = function(){ confetiLib = null; if(s.parentNode) s.parentNode.removeChild(s); mal(); };   // sin CDN, sin confeti: la app sigue igual
    document.head.appendChild(s);
  });
  return confetiLib;
}
function festejoTras(p){
  var f = estado.festejo = {t: Date.now(), grande: false, listo: false};
  if(!reducido()) confetiCargar().catch(function(){});   // precarga mientras vuelve la lista
  // hasta que vuelve la lista nueva, el home todavía cuenta como lista la botonera recién enviada: no se decide
  function listo(){ f.listo = true; festejoChequear(); }
  Promise.resolve(p).then(listo, listo);
  setTimeout(festejoChequear, 8100);
}
function enCero(H){ return !H.cargando && !H.pend && !H.listas.length && !H.fallan; }
function festejoChequear(){
  var f = estado.festejo; if(!f) return;
  if(Date.now() - f.t > 300e3){ estado.festejo = null; return; }   // un festejo que no se vio en 5 min ya no es de este envío
  if(!f.grande){
    var H = homeCalc();
    if((!f.listo || H.cargando) && Date.now() - f.t < 8000) return;   // homePintar lo vuelve a llamar cuando llegue cada botonera
    if(!f.listo || !enCero(H)){ estado.festejo = null; festejar('chico'); return; }
    f.grande = true;
  }
  var el = document.getElementById('home');
  if(estado.sw || estado.tab !== 'decisiones' || !el || (el.innerHTML && !el.offsetParent)) return;   // el grande sale cuando el home en cero está a la vista (un home vacío no se ve y tampoco bloquea: sin bloque «Por decidir» puede quedar vacío)
  estado.festejo = null;
  if(enCero(homeCalc())) festejar('grande');   // si mientras tanto llegaron cards, ya no es cero: sin festejo
}
function festejar(tipo){
  if(reducido()) return;
  confetiCargar().then(function(lib){
    var cv = document.createElement('canvas');
    cv.className = 'confeti'; cv.setAttribute('aria-hidden', 'true');
    document.body.appendChild(cv);
    var fx = null, vivo = true;
    function sacar(){ if(!vivo) return; vivo = false; try{ if(fx) fx.reset(); }catch(e){} if(cv.parentNode) cv.parentNode.removeChild(cv); }
    // sin worker: la CSP no deja crear uno desde blob:
    try{ fx = lib.create(cv, {resize: true, useWorker: false}); }catch(e){ sacar(); return; }
    function tiro(o){
      o.colors = CONFETI_COLORES; o.disableForReducedMotion = true;
      (window.__confeti || (window.__confeti = [])).push({tipo: tipo, particleCount: o.particleCount});
      try{ return fx(o); }catch(e){ sacar(); return null; }
    }
    if(tipo === 'chico'){
      Promise.resolve(tiro({particleCount: 90, spread: 75, startVelocity: 40, ticks: 70, origin: {y: 0.62}})).then(sacar, sacar);
      setTimeout(sacar, 4000);
      return;
    }
    // grande: cañones desde los dos costados durante 2,5 s y una ráfaga final al centro
    var t0 = Date.now();
    (function canon(){
      if(!vivo) return;
      if(Date.now() - t0 >= 2500){
        Promise.resolve(tiro({particleCount: 220, spread: 120, startVelocity: 52, ticks: 160, origin: {x: 0.5, y: 0.55}})).then(sacar, sacar);
        return;
      }
      tiro({particleCount: 14, angle: 60, spread: 55, startVelocity: 60, ticks: 160, origin: {x: 0, y: 0.75}});
      tiro({particleCount: 14, angle: 120, spread: 55, startVelocity: 60, ticks: 160, origin: {x: 1, y: 0.75}});
      setTimeout(canon, 200);
    })();
    setTimeout(sacar, 9000);
  }).catch(function(){});
}

  return {tab: estado.tab, badges: n, barra: !!(nav && nav.getBoundingClientRect().height > 0 && getComputedStyle(nav).display !== 'none'), rojo: accRojo(), regRojo: regRojo(), regN: regN(), decPunto: n.decisiones > 0};
};
window.__pestanas.ir = function(id){ tabIr(id); };   // solo para pruebas: abre una pestaña por id
function lecFecha(iso){   // «10-nov»
  var t = ms(iso); if(!t) return '';
  var p = snzPartes(t);
  return p.d + '-' + SW_MESES[p.m - 1];
}
function cargarPestana(S, nombre, rpc, cada, activo, alLlegar){
  var token = estado.token; if(!token) return;
  var X = estado[S] || (estado[S] = {d: null, err: false, t: 0, busy: false, vuelo: 0, tomT: 0, ed: {}});
  if(X.busy || (!activo && !X.forzar && X.t && Date.now() - X.t < cada) || (activo && X.t && Date.now() - X.t < activo)) return;
  var t0 = Date.now();   // cuando salio este pedido: una accion que se confirmo despues lo deja viejo (guard tomT)
  X.busy = true; X.t = t0; X.forzar = false;
  function fin(){ X.busy = false; if(token === estado.token) alLlegar(); }
  sb.rpc(rpc, {p_token: token}).then(function(r){
    if(token !== estado.token){ X.busy = false; return; }
    if(r.error && tokenMalo(r.error)){ X.busy = false; sesionVencida(); return; }
    if(X.vuelo > 0 || (X.tomT && X.tomT > t0)){ X.t = 0; }   // salio antes de un toque que ya se confirmo (o hay uno en vuelo): traeria de vuelta lo que se acaba de sacar
    else if(r.error || !r.data || !Array.isArray(r.data.items)){ X.err = true; X.t = 0; }
    else { X.d = r.data; X.err = false; }
    fin();
  }, function(){ X.err = true; X.t = 0; fin(); });
}
function accionesCargar(forzar){
  var A = estado.acc; if(forzar && A) A.forzar = true;
  var act = !!(A && A.activoHasta && A.activoHasta > Date.now());
  cargarPestana('acc', 'Acciones', 'bm_acciones_lista', ACC_CADA, act ? ACC_ACTIVO : 0, pestanasRepintar);
}
function pestanasRepintar(){ tabsPintar(); homePintar(); }

// repone lo que se estaba escribiendo en un campo de Bloqueos cuando se repinta el home (el texto vive en estado, el html trae solo el valor inicial)
function restaurarCampos(el, fk, ss){
  Array.prototype.forEach.call(el.querySelectorAll('[data-pt-in]'), function(ta){
    var tipo = ta.getAttribute('data-pt-in'), k = ta.getAttribute('data-k'), e = (estado.acc && estado.acc.ed || {})[k];
    if(e && typeof e.txt === 'string') ta.value = e.txt;
    if(fk && tipo + '\u0000' + k === fk){ try{ ta.focus({preventScroll: true}); ta.setSelectionRange(ss, ss); }catch(x){} }
  });
}
function alInputPt(e){
  var ta = e.target; if(!ta || !ta.getAttribute) return;
  if(!ta.getAttribute('data-pt-in')) return;
  var ed = (estado.acc && estado.acc.ed || {})[ta.getAttribute('data-k')];
  if(ed){ ed.txt = ta.value; if(ed.err){ ed.err = ''; var er = ta.parentNode && ta.parentNode.querySelector('.hac-err'); if(er) er.textContent = ''; } }
}

/* ----- Acciones ----- */
function accAbiertos(){ return accItems().filter(function(it){ return !it.estado || it.estado === 'abierta' || it.estado === 'abierto'; }); }   // v3.1 5/el bloque y la pestaña cuentan lo mismo: solo obstáculos abiertos
function accItems(){ var A = estado.acc; return A && A.d ? A.d.items.filter(function(it){ return it.origen === 'item'; }) : []; }   // solo obstaculos (si llegara una fila vieja de error o pedido, no se muestra)
function accKey(it){ return it.origen + '|' + it.ref; }
function accPorKey(k){
  var l = accItems();
  for(var i = 0; i < l.length; i++) if(accKey(l[i]) === k) return l[i];
  return null;
}
// los que frenan trabajo van arriba; dentro de cada grupo, el mas viejo primero (la base ya los manda asi: esto lo asegura tambien en el arnes)
function accOrden(l){
  return l.map(function(it, i){ return {it: it, i: i}; }).sort(function(a, b){
    var fa = a.it.frena ? 0 : 1, fb = b.it.frena ? 0 : 1; if(fa !== fb) return fa - fb;
    var ta = a.it.fecha ? ms(a.it.fecha) : Infinity, tb = b.it.fecha ? ms(b.it.fecha) : Infinity; if(isNaN(ta)) ta = Infinity; if(isNaN(tb)) tb = Infinity; if(ta !== tb) return ta < tb ? -1 : 1;
    return a.i - b.i;
  }).map(function(x){ return x.it; });
}
// el link vale solo si es https, sin usuario ni contrasena en la direccion; el texto muestra el sitio ENTERO (nunca recortado) y el camino recortado
function accLinkHTML(it){
  var u = String(it.link || ''), x;
  if(!/^https:\/\/[^\s\\]+$/i.test(u)) return '';
  try{ x = new URL(u); }catch(e){ return ''; }
  if(x.protocol !== 'https:' || x.username || x.password) return '';
  var cam = (x.pathname === '/' ? '' : x.pathname), txt = x.hostname.replace(/^www\./i, '') + (cam.length > 40 ? cam.slice(0, 39) + '…' : cam);
  return '<a class="hac-link" href="' + esc(x.href) + '" target="_blank" rel="noopener noreferrer">' + esc(txt) + ' ↗</a>';
}
// el comando se muestra y se copia sin caracteres de control ni de direccion de texto (lo que se ve es lo que se pega)
function accCmd(it){ return String(it.comando || '').replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g, ''); }
function accHTML(it){
  var k = accKey(it), ed = (estado.acc.ed || {})[k], dis = it.busy ? ' disabled' : '', d = 'data-k="' + esc(k) + '"';
  var h = '<div class="hac" ' + d + '><b>' + esc(it.titulo) + '</b>' + (it.frena ? '<span class="hac-frena">' + esc('Frena: ' + it.frena) + '</span>' : '') +
    (it.por_que ? '<span class="hac-por">' + esc(it.por_que) + '</span>' : '') + accLinkHTML(it) +
    (accCmd(it) ? '<span class="hac-cmd"><code>' + esc(accCmd(it)) + '</code><button type="button" class="hac-cp" data-pt="acc-copiar" ' + d + '>Copiar</button></span>' : '') +
    '<span class="hac-de">' + esc([it.de, it.fecha ? 'desde ' + lecFecha(it.fecha) : ''].filter(Boolean).join(' · ')) + '</span>';
  if(it.estado === 'no_puedo') h += '<span class="hac-m">' + esc('No puedo' + (it.comentario ? ': ' + it.comentario : '')) + '</span>';
  else if(it.estado === 'comentada') h += '<span class="hac-m">' + esc('Comentario: ' + (it.comentario || '')) + '</span>';
  if(ed){
    var lbl = ed.modo === 'no_puedo' ? 'Por qué no podés (opcional)' : ed.modo === 'listo' ? 'Algo para el agente (opcional)' : 'Tu comentario para el agente';
    h += '<label class="hac-l">' + esc(lbl) + '</label>' +
      '<textarea class="lac-ta" rows="3" data-pt-in="acc" ' + d + '>' + esc(ed.ini || '') + '</textarea>' + (ed.err ? '<span class="hac-err" role="alert">' + esc(ed.err) + '</span>' : '') +
      '<div class="bts"><button type="button" class="p" data-pt="acc-mandar" ' + d + dis + '>' + (ed.modo === 'listo' ? 'Listo' : ed.modo === 'no_puedo' ? 'No puedo' : 'Mandar') + '</button><button type="button" data-pt="acc-cancelar" ' + d + dis + '>Cancelar</button></div>';
  } else {
    h += '<div class="bts"><button type="button" class="p" data-pt="acc-hecho" ' + d + dis + '>Listo</button><button type="button" data-pt="acc-nopuedo" ' + d + dis + '>No puedo</button></div>' +
      '<button type="button" class="hac-com" data-pt="acc-comentar" ' + d + dis + '>Comentar</button>';
  }
  return h + '</div>';
}
// Listo: con comentario opcional. La fila sale al toque; si la base falla, vuelve y el comentario no se pierde.
function accHecha(k, com){
  var token = estado.token, A = estado.acc, it = accPorKey(k); if(!token || !A || !it || it.busy) return;
  var pos = A.d.items.indexOf(it), ed = A.ed[k];
  it.busy = true; A.vuelo++;
  A.d.items = A.d.items.filter(function(x){ return x !== it; });
  pestanasRepintar();
  function vuelve(){ it.busy = false; A.d.items.splice(Math.min(pos, A.d.items.length), 0, it); if(ed) A.ed[k] = ed; }
  function fin(){ A.vuelo = Math.max(0, A.vuelo - 1); }
  sb.rpc('bm_accion_hecha', {p_token: token, p_origen: it.origen, p_ref: it.ref, p_comentario: String(com || '')}).then(function(r){
    fin();
    if(token !== estado.token) return;
    if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
    if(r.error || !r.data){ vuelve(); pestanasRepintar(); snzToastMostrar(null, null, null, 'No se pudo'); return; }
    A.tomT = Date.now(); delete A.ed[k];
    var res = String(r.data.resultado || '');
    A.activoHasta = Date.now() + ACC_VENTANA;
    snzToastMostrar(null, null, null, res === 'ya no esta trabado' ? 'Ya no estaba trabado' : 'Listo: el agente sigue solo');
    pestanasRepintar();
  }, function(){ fin(); if(token === estado.token){ vuelve(); pestanasRepintar(); snzToastMostrar(null, null, null, 'No se pudo'); } });
}
function accAbrir(k, modo){
  var A = estado.acc, it = accPorKey(k); if(!A || !it) return;
  A.ed[k] = {modo: modo, ini: '', txt: '', err: ''};
  pestanasRepintar();
  var ta = null;
  Array.prototype.forEach.call(document.querySelectorAll('.hac textarea'), function(x){ if(x.getAttribute('data-k') === k) ta = x; });
  if(ta) try{ ta.focus({preventScroll: true}); }catch(e){}
}
// Mandar: Listo y No puedo con comentario opcional; Comentar (chico) lo exige y no saca la fila
function accMandar(k){
  var token = estado.token, A = estado.acc, it = accPorKey(k), ed = A && A.ed[k]; if(!token || !A || !it || !ed || it.busy) return;
  var txt = String(ed.txt || '').trim();
  if(ed.modo === 'listo'){ accHecha(k, txt); return; }
  if(ed.modo === 'comentar' && !txt){ ed.err = 'Escribí el comentario'; pestanasRepintar(); return; }
  it.busy = true; A.vuelo++; pestanasRepintar();
  function fin(){ it.busy = false; A.vuelo = Math.max(0, A.vuelo - 1); }
  sb.rpc('bm_accion_marcar', {p_token: token, p_origen: it.origen, p_ref: it.ref, p_estado: ed.modo === 'no_puedo' ? 'no_puedo' : 'comentada', p_comentario: txt}).then(function(r){
    fin();
    if(token !== estado.token) return;
    if(r.error && tokenMalo(r.error)){ sesionVencida(); return; }
    if(r.error || !r.data){ ed.err = 'No se pudo'; pestanasRepintar(); return; }
    A.tomT = Date.now(); delete A.ed[k];
    it.estado = r.data.estado || (ed.modo === 'no_puedo' ? 'no_puedo' : 'comentada'); it.comentario = r.data.comentario != null ? r.data.comentario : txt;
    snzToastMostrar(null, null, null, ed.modo === 'no_puedo' ? 'Anotado: se lo aviso al agente' : 'Comentario guardado');
    pestanasRepintar();
  }, function(){ fin(); if(token === estado.token){ ed.err = 'No se pudo'; pestanasRepintar(); } });
}
// el comando se copia con un toque (con respaldo para cuando el portapapeles no deja)
function accCopiar(k){
  var it = accPorKey(k), txt = it ? accCmd(it) : ''; if(!txt) return;
  function listo(){ snzToastMostrar(null, null, null, 'Copiado'); }
  function respaldo(){
    var t = document.createElement('textarea'); t.value = txt; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t); t.focus(); t.select(); try{ t.setSelectionRange(0, txt.length); }catch(e){}
    var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(t);
    if(ok) listo(); else snzToastMostrar(null, null, null, 'No se pudo copiar');
  }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(listo, respaldo); } else respaldo();
}

/* ----- los toques de las tres pestañas: #home, el lector y la barra ----- */
function alClickPt(e){
  var tg = e.target; if(!tg || !tg.closest) return;
  var b = tg.closest('[data-pt]'); if(!b || b.disabled) return;
  var a = b.getAttribute('data-pt'), k = b.getAttribute('data-k');
  if(a === 'acc-hecho') accAbrir(k, 'listo');   // Listo abre el comentario opcional; manda con «Listo» adentro (accMandar)
  else if(a === 'acc-nopuedo') accAbrir(k, 'no_puedo');
  else if(a === 'acc-comentar') accAbrir(k, 'comentar');
  else if(a === 'acc-mandar') accMandar(k);
  else if(a === 'acc-cancelar'){ if(estado.acc) delete estado.acc.ed[k]; pestanasRepintar(); }
  else if(a === 'acc-copiar') accCopiar(k);
}

/* ---------- arranque ---------- */
function init(){
  if(!configValida()){
    raiz.innerHTML = '<div class="entrada"><h1>Botonera sin configurar</h1><p>Falta config.js: copiá config.example.js como config.js y completá la URL y la llave publishable de tu proyecto Supabase.</p></div>';
    return;
  }
  if(!window.supabase){
    raiz.innerHTML = '<div class="entrada"><h1>No cargó</h1><p>No pude cargar la librería de acceso. Probá recargar.</p></div>';
    return;
  }
  // sin Supabase Auth: el acceso es el PIN (RPC bm_entrar) y el token vive en localStorage
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false}
  });
  // al volver a la pestaña se pone al dia sin esperar el poll
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && estado.token){ cargarLista(); avisosAlEntrar(); homePintar(); }
  });
  window.addEventListener('focus', function(){ if(estado.token) cargarLista(); });
  var t = leerToken();
  if(!t){ vistaEntrada(); return; }
  estado.token = t;
  vistaApp();
}
init();

})();
</script>
