<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITULO__</title>
<style>
  :root {
    --bg: #f6f3ee;
    --surface: #ffffff;
    --surface-2: #faf8f4;
    --ink: #1f2328;
    --muted: #5f6670;
    --faint: #9aa0a8;
    --line: #e4dfd6;
    --brand: #2f5d8a;
    --pic-a: #2f5d8a;
    --pic-b: #f0b44c;
    --pic-bg: #eaf0f6;
    --go: #1f8a56;
    --go-bg: #e3f3e9;
    --no: #c0435a;
    --no-bg: #fae6ea;
    --warn: #b5761a;
    --warn-bg: #f8eede;
    --shadow: 0 1px 2px rgba(31,35,40,.05), 0 6px 18px rgba(31,35,40,.06);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417; --surface: #1b1e23; --surface-2: #20242a; --ink: #e8eaed;
      --muted: #a2a9b2; --faint: #6f7781; --line: #2c3138; --brand: #7fb0e0;
      --pic-a: #7fb0e0; --pic-b: #f0c06a; --pic-bg: #1e2a37;
      --go: #4cc588; --go-bg: #14301f; --no: #e8788c; --no-bg: #331920;
      --warn: #d9a24a; --warn-bg: #322612;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121417; --surface: #1b1e23; --surface-2: #20242a; --ink: #e8eaed;
    --muted: #a2a9b2; --faint: #6f7781; --line: #2c3138; --brand: #7fb0e0;
    --pic-a: #7fb0e0; --pic-b: #f0c06a; --pic-bg: #1e2a37;
    --go: #4cc588; --go-bg: #14301f; --no: #e8788c; --no-bg: #331920;
    --warn: #d9a24a; --warn-bg: #322612;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans);
         -webkit-font-smoothing: antialiased; padding-bottom: 140px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 24px; }

  header { margin-bottom: 22px; }
  .eyebrow { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--brand); }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; margin-top: 4px; text-wrap: balance; }
  .lead { color: var(--muted); margin-top: 6px; max-width: 60ch; }
  .bulk { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .bulk button { font: 500 13px var(--sans); color: var(--muted); background: var(--surface);
                 border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  .bulk button:hover { color: var(--brand); border-color: var(--brand); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
          box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px;
          display: grid; grid-template-columns: 96px 1fr; gap: 6px 18px;
          border-left: 4px solid var(--line); transition: border-color .15s; }
  .card.go { border-left-color: var(--go); }
  .card.vc { border-left-color: var(--brand); }
  .card.rv { border-left-color: var(--go); }
  .card.revision .rev p { margin: 2px 0; font-size: 15px; } .card.revision .rev span { font-weight: 650; color: var(--ink); }
  .card.revision .kind { font: 650 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--go); }
  .card.no { border-left-color: var(--no); background: var(--surface-2); }
  .card.warning .pic { background: var(--warn-bg); }
  .card.danger .pic { background: var(--no-bg); }
  .pic { width: 96px; height: 96px; border-radius: 14px; background: var(--pic-bg);
         display: flex; align-items: center; justify-content: center; grid-row: span 3; }
  .pic svg { width: 72px; height: 72px; }
  .pic svg .a { stroke: var(--pic-a); }
  .pic svg .b { fill: var(--pic-b); }
  .pic svg .fa { fill: var(--pic-a); }
  .card.uno { grid-template-columns: 1fr; }
  .card.uno .reco { grid-column: 1; }
  .foto { grid-column: 1 / -1; margin: 8px 0 6px; }
  .foto img { display: block; width: 100%; height: auto; max-height: 220px; object-fit: cover; object-position: top;
              border-radius: 10px; border: 1px solid var(--line, #ddd); }
  .foto .afuera { display: inline-block; margin-top: 4px; font-size: 13px; }
  .card a, .blk a, .fyi a { color: inherit; text-decoration: underline; word-break: break-all; }
  .dib { margin: 8px 0 6px; padding: 12px; background: var(--surface-2); border-radius: 12px; }
  .dib svg { display: block; width: 100%; max-width: 380px; height: auto; margin: 0 auto; overflow: visible; }
  svg .a { stroke: var(--pic-a); fill: none; } svg .b { fill: var(--pic-b); } svg .fa { fill: var(--pic-a); }
  svg .t { fill: var(--ink); font: 600 12px var(--sans); } svg .tm { fill: var(--muted); font: 11px var(--sans); }
  svg .go { fill: var(--go); } svg .no { fill: var(--no); } svg .sgo { stroke: var(--go); fill: none; } svg .sno { stroke: var(--no); fill: none; }
  svg .box { fill: var(--surface); stroke: var(--line); }
  .imp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .imp div { padding: 8px 10px; border-radius: 8px; border-left: 3px solid; }
  .imp .pos { border-color: var(--go); background: var(--go-bg); }
  .imp .neg { border-color: var(--no); background: var(--no-bg); }
  .imp b { display: block; font-weight: 650; color: var(--ink); font-size: 13px; }
  @media (max-width: 520px) { .imp { grid-template-columns: 1fr; } }
  .num { font: 600 12px var(--mono); color: var(--faint); }
  .origen { font: 12px var(--sans); color: var(--faint); margin-top: 6px; }
  .tag.vence { color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); }
  .tag.vence.warning { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); }
  .antec { grid-column: 2; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
  .card.uno .antec { grid-column: 1; }
  .antec b { display: block; font-weight: 650; color: var(--ink); font-size: 13px; }
  .antec ul { margin: 2px 0 0 18px; }
  .antec .snd { margin-top: 6px; }
  .antec .snd span { font-weight: 650; color: var(--ink); }
  .aviso { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: 10px;
           padding: 10px 14px; font: 600 14px var(--sans); margin-bottom: 16px; }
  .tag { font: 600 11px var(--sans); border-radius: 99px; padding: 1px 8px; margin-left: 6px; }
  .tag.warning { color: var(--warn); background: var(--warn-bg); }
  .tag.danger { color: var(--no); background: var(--no-bg); }
  h2 { font-size: 18px; font-weight: 650; line-height: 1.3; margin-top: 2px; text-wrap: balance; }
  .ctx { color: var(--muted); font-size: 15px; }
  .reco { grid-column: 2; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .reco b { font-weight: 650; }
  .reco .r-go { color: var(--go); }
  .reco .r-no { color: var(--no); }
  .actions { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .btn { font: 650 15px var(--sans); border-radius: 10px; padding: 10px 22px; cursor: pointer;
         border: 2px solid var(--line); background: var(--surface); color: var(--muted); min-width: 96px; }
  .btn.go.rec { border-color: var(--go); color: var(--go); }
  .btn.no.rec { border-color: var(--no); color: var(--no); }
  .btn.go.on { background: var(--go); border-color: var(--go); color: #fff; }
  .btn.no.on { background: var(--no); border-color: var(--no); color: #fff; }
  .btn.go:hover { border-color: var(--go); color: var(--go); }
  .btn.no:hover { border-color: var(--no); color: var(--no); }
  .btn.vc.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.vc:hover { border-color: var(--brand); color: var(--brand); }
  .btn.on:hover { color: #fff; }
  /* Editar: los valores que propuso el agente, cargados en campos; el comentario libre queda siempre visible abajo */
  .pend { grid-column: 1 / -1; margin: 8px 0 0; font: 650 13px var(--sans); color: var(--brand); }
  .campos { grid-column: 1 / -1; display: grid; gap: 12px; margin-top: 10px; }
  .campos .lead { margin: 0; font-size: 14px; color: var(--muted); }
  .campos .f { display: grid; gap: 4px; }
  .campos label { font: 650 13px var(--sans); }
  .campos .in { font: 15px var(--sans); color: var(--ink); background: var(--surface); border: 2px solid var(--line-strong, var(--line)); border-radius: 10px; padding: 9px 12px; min-height: 44px; }
  .campos .in.ta { min-height: 150px; line-height: 1.45; resize: vertical; white-space: pre-wrap; }
  .campos .f.cambio .in { border-color: var(--brand); background: var(--brand-bg, var(--surface-2)); font-weight: 700; }
  .campos .tag-cambio, .campos .antes { display: none; font-size: 13px; color: var(--muted); }
  .campos .f.cambio .tag-cambio { display: inline; margin-left: 6px; font-size: 11px; font-weight: 700; color: var(--brand); }
  .campos .f.cambio .antes { display: flex; justify-content: space-between; gap: 8px; }
  .campos .antes s { opacity: .8; }
  .campos .fre { font: 650 13px var(--sans); background: none; border: 0; padding: 0; text-decoration: underline; color: var(--brand); cursor: pointer; }
  .comment { flex: 1 1 220px; font: 14px var(--sans); color: var(--ink); background: var(--surface-2);
             border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; resize: vertical; }
  details { grid-column: 1 / -1; margin-top: 8px; font-size: 14px; color: var(--muted); }
  summary { cursor: pointer; color: var(--brand); font-weight: 500; font-size: 13px; }
  details .d { margin-top: 8px; display: grid; gap: 6px; }
  details .d p span { font-weight: 650; color: var(--ink); }
  details code { font: 12px var(--mono); background: var(--surface-2); padding: 1px 4px; border-radius: 4px; word-break: break-all; }

  .layout { display: block; }
  #idx { display: none; }
  .con-indice .wrap { max-width: 1040px; }
  .con-indice .layout { display: grid; grid-template-columns: 230px 1fr; gap: 24px; align-items: start; }
  .con-indice #idx { display: block; position: sticky; top: 16px; max-height: calc(100vh - 150px); overflow-y: auto;
         background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; }
  #idx .h { font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 4px 8px 8px; }
  #idx a { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 7px; color: var(--ink);
         text-decoration: none; font-size: 13px; line-height: 1.3; }
  #idx a:hover { background: var(--surface-2); }
  #idx .dot { flex: 0 0 9px; height: 9px; border-radius: 50%; border: 2px solid var(--faint); transform: translateY(1px); }
  #idx .dot.go { background: var(--go); border-color: var(--go); }
  #idx .dot.no { background: var(--no); border-color: var(--no); }
  #idx .dot.vc { background: var(--brand); border-color: var(--brand); }
  #idx .nn { font: 600 11px var(--mono); color: var(--faint); min-width: 16px; }
  .card, .sec-head { scroll-margin-top: 16px; }
  .sec-head { margin: 30px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .sec-head:first-child { margin-top: 0; }
  .sec-head h3 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .sec-head .cnt { font: 600 12px var(--mono); color: var(--faint); }
  .sec-head .nota { width: 100%; font-size: 14px; color: var(--muted); }
  #idx .sec { display: flex; justify-content: space-between; gap: 8px; padding: 10px 8px 4px; font-weight: 650; font-size: 13px;
         color: var(--ink); text-decoration: none; }
  #idx .sec .c { font: 600 11px var(--mono); color: var(--faint); }
  #idx .sec.done .c { color: var(--go); }
  @media (max-width: 820px) {
    .con-indice .layout { display: block; }
    .con-indice #idx { position: static; max-height: none; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 4px; }
    #idx .h { width: 100%; }
    #idx a .tt { display: none; }
    #idx .sec { width: 100%; padding: 8px 4px 2px; border: 0; }
    #idx a { padding: 5px 8px; border: 1px solid var(--line); }
  }
  .intro { margin: 0 0 22px; display: grid; gap: 10px; }
  .intro .blk { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .intro .blk h4 { font-size: 15px; font-weight: 650; margin-bottom: 4px; }
  .intro .blk p { color: var(--muted); font-size: 15px; }
  .intro .blk ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 15px; }
  .intro .blk li { margin: 2px 0; }
  .fyi-wrap { margin: 22px 0 8px; }
  .fyi-wrap .fyi { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; }
  .fyi-wrap h4 { font-size: 15px; font-weight: 650; margin-bottom: 4px; }
  .fyi-wrap .lf { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .fyi-wrap .gt { font-weight: 650; font-size: 13.5px; color: var(--ink); margin: 8px 0 2px; }
  .fyi-wrap ul { margin: 0 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .notas { margin-top: 8px; }
  .notas label { font-weight: 600; font-size: 14px; }
  .notas textarea { width: 100%; margin-top: 6px; font: 14px var(--sans); color: var(--ink); background: var(--surface);
                    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 64px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
         box-shadow: 0 -4px 18px rgba(0,0,0,.06); padding: 12px 16px; }
  .bar .in { max-width: 720px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .tally { display: flex; gap: 12px; font: 600 14px var(--mono); }
  .tally .g { color: var(--go); } .tally .n { color: var(--no); } .tally .u { color: var(--faint); }
  .copy { margin-left: auto; font: 650 15px var(--sans); background: var(--brand); color: #fff; border: 0;
          border-radius: 10px; padding: 11px 20px; cursor: pointer; }
  .copy:disabled { opacity: .6; cursor: default; }
  .hint { width: 100%; font-size: 12.5px; color: var(--faint); }
  .hint.err { color: var(--no); }
  @media (max-width: 520px) {
    .card { grid-template-columns: 64px 1fr; gap: 4px 12px; padding: 14px; }
    .pic { width: 64px; height: 64px; grid-row: span 2; }
    .pic svg { width: 48px; height: 48px; }
    .reco, .antec { grid-column: 1 / -1; }
    .btn { flex: 1; }
    .copy { width: 100%; margin-left: 0; }
  }
  @media print { .bar, .bulk { display: none; } body { padding-bottom: 0; } .card { break-inside: avoid; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="titulo"></h1>
    <p class="lead" id="lead"></p>
    <p class="origen" id="origen" hidden></p>
    <div class="bulk">
      <button type="button" id="bulk-reco">Marcar todo como recomienda el agente</button>
      <button type="button" id="bulk-clear">Borrar marcas</button>
    </div>
  </header>
  <div class="layout">
    <nav id="idx" aria-label="Índice de decisiones"></nav>
    <div>
      <div class="intro" id="intro"></div>
      <main id="items"></main>
      <div id="fyi" class="fyi-wrap"></div>
      <div class="notas">
        <label for="notas">¿Algo que la botonera no previó?</label>
        <textarea id="notas" placeholder="Opcional"></textarea>
      </div>
    </div>
  </div>
</div>
<div class="bar"><div class="in">
  <div class="tally"><span class="g" id="t-go"></span><span class="n" id="t-no"></span><span class="u" id="t-un"></span></div>
  <button type="button" class="copy" id="copy">Copiar respuesta</button>
  <div class="hint" id="hint">Copiá y pegala en el chat. Lo que no marques no se hace.</div>
</div></div>

<script>
const DATA = /*__DATA__*/null;

// Pictogramas: iconos.json (viewBox 0 0 64 64; clase a = trazo, b = relleno de acento, fa = relleno principal).
const ICONS = /*__ICONOS__*/{};
const svgFor = it => '<svg viewBox="0 0 64 64" aria-hidden="true">' + (it.svg || ICONS[it.icono] || ICONS.pregunta) + '</svg>';

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// esc + las URLs https como link (abren afuera: la web le da allow-popups al iframe)
const lnk = s => esc(s).replace(/https:\/\/[^\s<"]+/g, u => {
  const m = /[).,;:]+$/.exec(u), tail = m ? m[0] : '', url = tail ? u.slice(0, -tail.length) : u;
  return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`;
});
// imagen de lo que se aprueba (mapa, maqueta): solo data: URI, link opcional https
function imagenHTML(it) {
  const im = it.imagen;
  if (!im || !/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(im.src || '')) return '';
  const link = /^https:\/\/[^\s"'<>]+$/.test(im.link || '') ? im.link : '';
  const img = `<img src="${im.src}" alt="${esc(im.alt || '')}">`;
  return `<div class="foto">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${img}</a>` +
    `<a class="afuera" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Abrir afuera ↗</a>` : img}</div>`;
}
const recoGo = it => /^va$/i.test((it.reco || '').trim());
const state = {};   // n -> {m: "go"|"no"|"vc"|"", c: "", f: {id: valor nuevo}}  (vc = Editar: va con cambios)
// `campos` del ítem (máx. 5): {id, etiqueta, valor, tipo: texto|textarea|numero|fecha|opcion, opciones?}. Misma forma que valida armar.py.
const camposDe = it => (Array.isArray(it.campos) ? it.campos : []).filter(c => c && /^[a-z0-9_-]{1,30}$/.test(String(c.id || '')) && c.etiqueta &&
  ['texto', 'textarea', 'numero', 'fecha', 'opcion'].includes(c.tipo) && (c.tipo !== 'opcion' || (Array.isArray(c.opciones) && c.opciones.length >= 2)))
  .slice(0, 5).map(c => ({ id: String(c.id), etiqueta: String(c.etiqueta), tipo: c.tipo, valor: c.valor == null ? '' : String(c.valor), opciones: (c.opciones || []).map(String) }));
const mismo = (tipo, a, b) => { a = String(a == null ? '' : a).replace(/\r\n?/g, '\n').trim(); b = String(b == null ? '' : b).replace(/\r\n?/g, '\n').trim();
  return tipo === 'numero' && a !== '' && b !== '' && isFinite(+a) && isFinite(+b) ? +a === +b : a === b; };
// «id=nuevo (antes viejo); …» de los campos que cambiaron, en el orden del ítem
const camposN = (it, f) => !f ? 0 : camposDe(it).filter(c => f[c.id] != null && !mismo(c.tipo, f[c.id], c.valor)).length;
const camposTxt = (it, f) => !f ? '' : camposDe(it).filter(c => f[c.id] != null && !mismo(c.tipo, f[c.id], c.valor))
  .map(c => c.tipo === 'textarea'   // texto largo: una línea, cada salto de línea vuelve como ⏎ y el original no se repite
    ? c.id + '=' + String(f[c.id]).replace(/\r\n?/g, '\n').trim().split('\n').map(l => l.replace(/[ \t]+/g, ' ').trim()).join('⏎') + ' (antes: borrador de ' + c.valor.length + ' caracteres)'
    : c.id + '=' + String(f[c.id]).replace(/\s+/g, ' ').trim() + ' (antes ' + c.valor.replace(/\s+/g, ' ').trim() + ')').join('; ');
function campoHTML(c, val, i, n) {
  const id = 'f-' + n + '-' + i, cam = !mismo(c.tipo, val, c.valor);
  const inp = c.tipo === 'opcion'
    ? `<select id="${id}" class="in" data-f="${esc(c.id)}">${c.opciones.map(o => `<option value="${esc(o)}"${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
    : c.tipo === 'textarea' ? `<textarea id="${id}" class="in ta" data-f="${esc(c.id)}" rows="${Math.min(14, Math.max(6, String(val).split('\n').length + 1))}" autocomplete="off">${esc(val)}</textarea>`
    : `<input id="${id}" class="in" data-f="${esc(c.id)}" type="${c.tipo === 'numero' ? 'number' : c.tipo === 'fecha' ? 'date' : 'text'}"${c.tipo === 'numero' ? ' step="any"' : ''} value="${esc(val)}" autocomplete="off">`;
  return `<div class="f${cam ? ' cambio' : ''}" data-tipo="${esc(c.tipo)}" data-orig="${esc(c.valor)}"><label for="${id}">${esc(c.etiqueta)}<span class="tag-cambio">Cambiado</span></label>${inp}` +
    `<div class="antes"><span>Antes: <s>${esc(c.tipo === 'textarea' ? (c.valor.replace(/\s+/g, ' ').trim().length > 90 ? c.valor.replace(/\s+/g, ' ').trim().slice(0, 90) + '…' : c.valor.replace(/\s+/g, ' ').trim()) : c.valor)}</s></span><button type="button" class="fre">Volver al original</button></div></div>`;
}
// Card de revisión: qué hizo el agente, qué verificó, qué te queda mirar, y la imagen o el link.
function revisionHTML(it) {
  const lk = /^https:\/\/[^\s"'<>]+$/.test((it.imagen || {}).link || it.link || '') ? ((it.imagen || {}).link || it.link) : '';
  return `<div class="rev"><p class="kind">Revisión</p>` +
    `<p><span>Qué hice:</span> ${esc(it.hice)}</p><p><span>Qué verifiqué:</span> ${esc(it.verifique)}</p><p><span>Qué te queda mirar:</span> ${esc(it.mirar)}</p>` +
    (lk && !it.imagen ? `<p><a href="${esc(lk)}" target="_blank" rel="noopener noreferrer">${esc(lk.replace(/^https:\/\//, ''))} ↗</a></p>` : '') + `</div>`;
}
const EMBEBIDO = window.self !== window.top;   // va en el iframe de la página de la web (ver el contrato más abajo)

// vence (AAAA-MM-DD) -> «25-oct»; vencido = hoy o antes (comparación de texto AAAA-MM-DD, sin husos).
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function chipVence(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ''));
  if (!m) return '';
  const d = new Date(), hoy = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return `<span class="tag vence${v <= hoy ? ' warning' : ''}">vence ${+m[3]}-${MESES[+m[2] - 1]}</span>`;
}
function bloqueAntecedentes(it) {
  const a = (it.antecedentes || []).slice(0, 3);
  if (!a.length && !it.si_no_decidis) return '';
  return `<div class="antec">` +
    (a.length ? `<b>Qué pasó hasta acá</b><ul>${a.map(x => `<li>${lnk(x)}</li>`).join('')}</ul>` : '') +
    (it.si_no_decidis ? `<p class="snd"><span>Si no decidís:</span> ${esc(it.si_no_decidis)}</p>` : '') +
    `</div>`;
}

// Aplica unas marcas {items, notas} (de localStorage o del padre): solo las de ítems que existen, con la forma validada.
function aplicarMarcas(mk) {
  if (!mk || typeof mk !== 'object') return;
  const items = mk.items && typeof mk.items === 'object' ? mk.items : {};
  DATA.items.forEach(it => {
    const v = items[it.n];
    if (v && typeof v === 'object') state[it.n] = { m: v.m === 'go' || v.m === 'no' || v.m === 'vc' || (v.m === 'rv' && it.tipo === 'revision') ? v.m : '', c: typeof v.c === 'string' ? v.c : '',
      f: v.f && typeof v.f === 'object' && !Array.isArray(v.f) ? v.f : {} };
  });
  if (typeof mk.notas === 'string') document.getElementById('notas').value = mk.notas;
}
function load() {
  try { aplicarMarcas(JSON.parse(localStorage.getItem(DATA.clave) || '{}')); } catch (e) {}
}
function save() {
  const marcas = { items: state, notas: document.getElementById('notas').value };
  try { localStorage.setItem(DATA.clave, JSON.stringify(marcas)); } catch (e) {}
  // sin allow-same-origin el localStorage del iframe no persiste: las marcas viajan al padre, que las guarda y las devuelve al recargar
  if (EMBEBIDO) window.parent.postMessage({ tipo: 'botonera-marcas', clave: DATA.clave, marcas }, '*');
}

function render() {
  document.title = DATA.titulo;
  document.getElementById('eyebrow').textContent = (DATA.eyebrow || 'Botonera') + ' · ' + DATA.fecha;
  document.getElementById('titulo').textContent = DATA.titulo;
  document.getElementById('lead').textContent = DATA.contexto || '';
  const og = document.getElementById('origen'), o = DATA.origen || {};
  const ogTxt = [o.sesion_titulo && 'Sesión: ' + o.sesion_titulo, o.skill, o.proyecto].filter(Boolean).join(' · ');
  og.textContent = ogTxt; og.hidden = !ogTxt;
  document.getElementById('intro').innerHTML = (DATA.intro || []).map(b =>
    `<div class="blk">${b.titulo ? `<h4>${esc(b.titulo)}</h4>` : ''}` +
    (b.texto ? String(b.texto).split(/\n\n+/).map(p => `<p>${lnk(p)}</p>`).join('') : '') +
    (b.items ? `<ul>${b.items.map(i => `<li>${lnk(i)}</li>`).join('')}</ul>` : '') +
    `</div>`).join('');
  const root = document.getElementById('items');
  root.innerHTML = '';
  grupos().forEach(g => {
   if (g.titulo) {
    const h = document.createElement('div');
    h.className = 'sec-head'; h.id = 's-' + g.id;
    h.innerHTML = `<h3>${esc(g.titulo)}</h3><span class="cnt">${g.items.length} ${g.items.length === 1 ? 'decisión' : 'decisiones'}</span>` +
      (g.nota ? `<p class="nota">${esc(g.nota)}</p>` : '');
    root.appendChild(h);
   }
   g.items.forEach(it => {
    const st = state[it.n] || (state[it.n] = { m: '', c: '', f: {} });
    const cs = camposDe(it);
    const panel = st.m === 'vc' && cs.length
      ? `<div class="campos"><p class="lead">Esto propuso el agente. Cambiá lo que quieras.</p>` +
        cs.map((c, i) => campoHTML(c, (st.f || {})[c.id] != null ? String(st.f[c.id]) : c.valor, i, it.n)).join('') + `</div>` : '';
    const card = document.createElement('article');
    card.id = 'd-' + it.n;
    const conPic = !it.dibujo && (it.svg || it.icono);
    card.className = 'card' + (conPic ? '' : ' uno') + (it.accent ? ' ' + it.accent : '') + (it.tipo === 'revision' ? ' revision' : '') + (st.m ? ' ' + st.m : '');
    const tag = it.accent === 'danger' ? '<span class="tag danger">ojo</span>' : it.accent === 'warning' ? '<span class="tag warning">sensible</span>' : '';
    const imp = it.impacto && (it.impacto.positivo || it.impacto.negativo)
      ? `<div class="imp"><div class="pos"><b>Impacto positivo</b>${esc(it.impacto.positivo || 'nada relevante')}</div>` +
        `<div class="neg"><b>Impacto negativo</b>${esc(it.impacto.negativo || 'nada relevante')}</div></div>` : '';
    const det = [
      imp,
      it.porque && `<p><span>Por qué:</span> ${esc(it.porque)}</p>`,
      it.si_va && `<p><span>Si va:</span> ${esc(it.si_va)}</p>`,
      it.si_no_va && `<p><span>Si no va:</span> ${esc(it.si_no_va)}</p>`,
      it.fuente && `<p><span>Fuente:</span> ${/https:\/\//.test(it.fuente) ? lnk(it.fuente) : `<code>${esc(it.fuente)}</code>`}</p>`
    ].filter(Boolean).join('');
    card.innerHTML =
      (conPic ? `<div class="pic">${svgFor(it)}</div>` : '') +
      `<div><span class="num">${it.n}</span>${tag}${chipVence(it.vence)}<h2>${esc(it.titulo)}</h2></div>` +
      (it.dibujo ? `<div class="dib"><svg viewBox="${esc(it.dibujo.viewBox || '0 0 240 100')}" role="img" aria-label="${esc(it.dibujo.alt || '')}">${it.dibujo.svg}</svg></div>` : '') +
      imagenHTML(it) +
      (it.tipo === 'revision' ? revisionHTML(it) : `<p class="ctx">${lnk(it.contexto)}</p>`) +
      (it.tipo === 'revision' ? '' : bloqueAntecedentes(it)) +
      (it.tipo === 'revision' ? '' : `<p class="reco">El agente recomienda <b class="${recoGo(it) ? 'r-go' : 'r-no'}">${esc(recoGo(it) ? (it.accion_va || 'Va') : (it.accion_no_va || 'No va'))}</b><span>${esc(it.reco_motivo)}</span></p>`) +
      panel +
      (st.m !== 'vc' && st.m !== 'no' && camposN(it, st.f) ? `<p class="pend" role="status">${camposN(it, st.f)} ${camposN(it, st.f) === 1 ? 'cambio pendiente' : 'cambios pendientes'} · Va los manda con el cambio</p>` : '') +
      (it.tipo === 'revision' ? `<div class="actions"><button type="button" class="btn go on-rv${st.m === 'rv' ? ' on' : ''}" data-m="rv">Revisado</button>` +
        `<textarea class="comment" rows="1" placeholder="Comentar sirve para pedir un cambio">${esc(st.c)}</textarea></div>` : `<div class="actions">` +
        `<button type="button" class="btn no${recoGo(it) ? '' : ' rec'}${st.m === 'no' ? ' on' : ''}" data-m="no">${esc(it.accion_no_va || 'No va')}</button>` +
        `<button type="button" class="btn vc${st.m === 'vc' ? ' on' : ''}" data-m="vc">Editar</button>` +
        `<button type="button" class="btn go${recoGo(it) ? ' rec' : ''}${st.m === 'go' ? ' on' : ''}" data-m="go">${esc(it.accion_va || 'Va')}</button>` +
        `<textarea class="comment" rows="1" placeholder="Comentario (opcional)">${esc(st.c)}</textarea>` +
      `</div>`) +
      (det ? `<details><summary>Ver el detalle</summary><div class="d">${det}</div></details>` : '');
    card.querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => {
      st.m = st.m === b.dataset.m ? '' : b.dataset.m; save(); render();
    }));
    card.querySelector('.comment').addEventListener('input', e => { st.c = e.target.value; save(); });
    // Editar: los campos se guardan al escribir; el que cambia queda marcado, con «Antes: X» y «Volver al original»
    const sync = () => {
      const f = {};
      card.querySelectorAll('.campos .f').forEach(w => { const i = w.querySelector('[data-f]'), cam = !mismo(w.dataset.tipo, i.value, w.dataset.orig);
        w.classList.toggle('cambio', cam); if (cam) f[i.dataset.f] = i.value; });
      st.f = f; save();
    };
    card.querySelectorAll('.campos [data-f]').forEach(i => i.addEventListener('input', sync));
    card.querySelectorAll('.campos .fre').forEach(b => b.addEventListener('click', () => {
      const i = b.closest('.f').querySelector('[data-f]'); i.value = b.closest('.f').dataset.orig; sync();
    }));
    root.appendChild(card);
   });
  });
  renderFyi();
  tally();
}

function renderFyi() {
  const f = DATA.fyi, el = document.getElementById('fyi');
  if (!el) return;
  if (!f) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="fyi"><h4>${esc(f.titulo || 'Para tu info — no son decisiones')}</h4>` +
    (f.lead ? `<p class="lf">${esc(f.lead)}</p>` : '') +
    (f.grupos || []).map(g => `${g.titulo ? `<div class="gt">${esc(g.titulo)}</div>` : ''}<ul>${(g.items || []).map(i => `<li>${lnk(i)}</li>`).join('')}</ul>`).join('') +
    `</div>`;
}

// Secciones: opcionales. Con 2 o más hay encabezados y índice lateral; sin secciones, lista corrida.
function grupos() {
  const S = DATA.secciones || [];
  if (S.length < 2) return [{ id: '', titulo: '', items: DATA.items }];
  const out = S.map(x => ({ id: x.id, titulo: x.titulo, nota: x.nota, items: DATA.items.filter(it => it.seccion === x.id) }));
  const sueltos = DATA.items.filter(it => !S.some(x => x.id === it.seccion));
  if (sueltos.length) out.push({ id: 'otras', titulo: 'Otras', items: sueltos });
  return out.filter(g => g.items.length);
}

function indice() {
  const nav = document.getElementById('idx');
  const G = grupos();
  if (G.length < 2) return;
  document.body.classList.add('con-indice');
  nav.innerHTML = '<div class="h">' + DATA.items.length + ' decisiones</div>' + G.map(g => {
    const hechas = g.items.filter(it => (state[it.n] || {}).m).length;
    return `<a class="sec${hechas === g.items.length ? ' done' : ''}" href="#s-${encodeURIComponent(g.id)}"><span>${esc(g.titulo)}</span><span class="c">${hechas}/${g.items.length}</span></a>` +
      g.items.map(it => {
        const m = (state[it.n] || {}).m || '';
        return `<a href="#d-${encodeURIComponent(it.n)}"><span class="dot ${m}"></span><span class="nn">${it.n}</span><span class="tt">${esc(it.titulo)}</span></a>`;
      }).join('');
  }).join('');
}

function tally() {
  indice();
  const v = Object.values(state);
  const go = v.filter(s => s.m === 'go' || s.m === 'vc' || s.m === 'rv').length, no = v.filter(s => s.m === 'no').length;
  document.getElementById('t-go').textContent = go + ' va';
  document.getElementById('t-no').textContent = no + ' no va';
  document.getElementById('t-un').textContent = (DATA.items.length - go - no) + ' sin marcar';
}

function respuesta() {
  const L = ['/botonera respuesta · ' + DATA.clave];
  DATA.items.forEach(it => {
    const st = state[it.n] || {};
    if (it.tipo === 'revision') {   // Revisado = «revisado»; comentar solo = pedir un cambio (nunca cuenta como revisado)
      const c = st.c && st.c.trim();
      L.push(it.n + '. ' + (st.m === 'rv' ? 'revisado' : c ? 'comentario' : 'sin marcar') + ' · ' + it.titulo + (c ? ' · comentario: ' + c : ''));
      return;
    }
    // un Va con cambios escritos en Editar sin confirmar sale como «va con cambios»; Editar sin campos ni comentario es un va liso
    const cf = st.m === 'go' || st.m === 'vc' ? camposTxt(it, st.f) : '';
    let mk = st.m;
    if (mk === 'go' && cf) mk = 'vc';
    if (mk === 'vc' && !cf && !(st.c && st.c.trim())) mk = 'go';
    const m = mk === 'go' ? 'va' : mk === 'vc' ? 'va con cambios' : mk === 'no' ? 'no va' : 'sin marcar';
    const acc = mk === 'go' || mk === 'vc' ? it.accion_va : mk === 'no' ? it.accion_no_va : '';
    L.push(it.n + '. ' + m + ' · ' + it.titulo + (acc ? ' → ' + acc : '') + (cf ? ' · campos: ' + cf : '') + (st.c && st.c.trim() ? ' · comentario: ' + st.c.trim() : ''));
  });
  const n = document.getElementById('notas').value.trim();
  if (n) L.push('notas: ' + n);
  return L.join('\n');
}

document.getElementById('bulk-reco').addEventListener('click', () => {
  DATA.items.forEach(it => { state[it.n].m = it.tipo === 'revision' ? 'rv' : recoGo(it) ? 'go' : 'no'; }); save(); render();
});
document.getElementById('bulk-clear').addEventListener('click', () => {
  DATA.items.forEach(it => { state[it.n].m = ''; }); save(); render();
});
document.getElementById('notas').addEventListener('input', save);

// Modo embebido (la botonera va en un iframe srcdoc de la página de la web, sandbox sin allow-same-origin). Contrato de mensajes:
//   botonera -> padre : {tipo:'botonera-respuesta', clave, texto}   (texto = el mismo de respuesta())
//   botonera -> padre : {tipo:'botonera-marcas', clave, marcas:{items, notas}}   (en cada save(): el padre las guarda por clave)
//   padre -> botonera : {tipo:'botonera-marcas', marcas}            (al cargar, ANTES del estado: se aplican y se re-renderiza)
//                       {tipo:'botonera-estado', estado}            (al cargar; si no es 'abierta': aviso + sin envío)
//                       {tipo:'botonera-ok'}                        (queda «Enviada ✓», deshabilitado)
//                       {tipo:'botonera-error', motivo}             (vuelve a «Enviar respuesta» + motivo)
// El iframe tiene alto fijo de viewport y el scroll va adentro: la barra de «Enviar respuesta» queda siempre visible.
// Mensajes con otro tipo, o que no vengan del padre, se ignoran. Fuera del iframe nada de esto corre (sigue localStorage).
// Sin handlers inline en atributos ni URLs con javascript: todo va con addEventListener, para poder fijar un CSP con hash de los <script>.
const copyBtn = document.getElementById('copy'), hintEl = document.getElementById('hint');
let bloqueada = false;
let avisoEl = null;   // un solo nodo .aviso, reutilizado
if (EMBEBIDO) {
  copyBtn.textContent = 'Enviar respuesta';
  hintEl.textContent = 'Enviá la respuesta. Lo que no marques no se hace.';
  window.addEventListener('message', e => {
    const m = e.data;
    if (e.source !== window.parent || !m || typeof m !== 'object') return;
    if (m.tipo === 'botonera-ok') {
      copyBtn.textContent = 'Enviada ✓'; copyBtn.disabled = true; hintEl.className = 'hint';
    } else if (m.tipo === 'botonera-error') {
      copyBtn.textContent = 'Enviar respuesta'; copyBtn.disabled = bloqueada;
      hintEl.textContent = m.motivo ? String(m.motivo) : 'No se pudo enviar.'; hintEl.className = 'hint err';
    } else if (m.tipo === 'botonera-marcas') {
      aplicarMarcas(m.marcas); render();
    } else if (m.tipo === 'botonera-estado' && m.estado && m.estado !== 'abierta') {
      bloqueada = true; copyBtn.disabled = true;
      if (!avisoEl) { avisoEl = document.createElement('div'); avisoEl.className = 'aviso'; }
      avisoEl.textContent = 'Esta botonera ya está ' + String(m.estado);
      if (!avisoEl.isConnected) document.querySelector('.wrap').prepend(avisoEl);
    }
  });
}

copyBtn.addEventListener('click', async () => {
  if (EMBEBIDO) {
    if (bloqueada) return;
    copyBtn.textContent = 'Enviando…'; copyBtn.disabled = true; hintEl.className = 'hint';
    window.parent.postMessage({ tipo: 'botonera-respuesta', clave: DATA.clave, texto: respuesta() }, '*');
    return;
  }
  const txt = respuesta(), hint = hintEl;
  try { await navigator.clipboard.writeText(txt); hint.textContent = 'Copiado. Pegalo en el chat.'; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); hint.textContent = 'Copiado. Pegalo en el chat.'; } catch (_) { hint.textContent = 'No pude copiar: seleccioná el texto a mano.'; }
    ta.remove();
  }
});

load(); render();
</script>
</body>
</html>
